# ============================================================================
# AnimaLoraToolkit base 对齐诊断配置
# 用途：排查新版 loss 起步是否只是“训练目标/采样分布”变了。
# 建议先跑 20~80 step，看 debug 日志里的 t/noise/target/pred 统计。
# ============================================================================

# 模型路径
transformer_path: "AnimaLoratoolkit/models/transformers/anima-preview3-base.safetensors"
vae_path: "AnimaLoratoolkit/models/vae/qwen_image_vae.safetensors"
text_encoder_path: "AnimaLoratoolkit/models/text_encoders"
t5_tokenizer_path: "AnimaLoratoolkit/models/t5_tokenizer"

# 数据集：先用你正在观察 loss 的同一个数据集
data_dir: "./Dataset/your-dataset"
resolution: 1024
repeats: 1
reg_data_dir: ""
reg_repeats: 1
reg_caption: ""

# 尽量关闭会改变 caption 条件的随机项
shuffle_caption: true
keep_tokens: 1
flip_augment: true
tag_dropout: 0.0
prefer_json: true
cache_latents: true

# LoRA / LoKr：关闭新版 dropout，保留容量
lora_type: "lokr"
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0
lokr_factor: 8
use_t5_token_weights: false           # base 训练前向没有实际乘 token 权重

# 训练参数：这里只为了对齐 loss 标尺，不作为最终推荐参数
optimizer_type: "prodigyplus"
learning_rate: 1.0
lr_scheduler: "none"
lr_scheduler_t0: 0
lr_scheduler_t_mult: 0
lr_scheduler_eta_min: 1.0e-6

optimizer_args:
  lr: 1.0
  betas: [0.9, 0.99]
  beta3: null
  eps: null
  weight_decay: 0.0
  d0: 1.0e-6
  d_coef: 1.0
  d_limiter: false
  safeguard_warmup: false
  use_schedulefree: true
  use_stableadamw: true
  split_groups: false
  factored: false

prodigyplus_d0: 1.0e-6
prodigyplus_use_stableadamw: true

epochs: 1
max_steps: 80
batch_size: 2
grad_accum: 1
weight_decay: 0
grad_clip_max_norm: 1.0               # base 中 grad_clip=0 也会实际裁到 1.0
mixed_precision: "bf16"
grad_checkpoint: false
xformers: false
num_workers: 0

# Flow Matching：严格回到 base 的 logit_normal + shift=3 + 标准高斯噪声
flow_shift: 3.0
timestep_sampling: "logit_normal"
loss_weighting_scheme: "none"
min_snr_gamma: 0.0
noise_offset: 0.0
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3
caption_dropout_rate: 0.0

# 输出与采样：诊断时尽量少干扰
output_dir: "./output/base_compare"
output_name: "base-compare"
save_every: 0
save_every_steps: 40
save_state_every: 0
seed: 42
resume_lora: ""
resume_state: ""

sample_every: 0
sample_steps: 0
sample_infer_steps: 25
sample_cfg_scale: 4.0
sample_sampler_name: "er_sde"
sample_scheduler: "simple"
sample_width: 0
sample_height: 0
sample_seed: 0
sample_negative_prompt: ""
sample_prompt: " @your-trigger,newest, safe, 1girl, masterpiece, best quality"

# 诊断日志
loss_curve_steps: 1
no_progress: false
log_every: 1
debug_first_batches: 8                # 新增：打印前 8 个 step 的张量统计

no_monitor: false
monitor_host: "0.0.0.0"
monitor_port: 8765
no_browser: true
