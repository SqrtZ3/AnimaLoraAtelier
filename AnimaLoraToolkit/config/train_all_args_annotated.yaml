# AnimaLoraToolkit 全参数说明版配置
# 目的：
#   1. 列出 anima_train.py 当前可从 YAML 传入的全部顶层参数。
#   2. 列出 ProdigyPlusScheduleFree 2.0.x 公开文档中的全部主要 optimizer 参数。
#   3. 每个参数旁边写出调大会怎样、调小会怎样、什么时候建议启用。
#
# 使用建议：
#   - 第一次跑不要一次改太多。先复制本文件，改路径、data_dir、output_dir。
#   - ProdigyPlus + Schedule-Free 请保持 lr_scheduler: "none"，并保持 learning_rate: 1.0。
#   - 本补丁代码会在保存/采样前调用 optimizer.eval()，回到训练时 optimizer.train()。

# ============================================================================
# 模型路径
# ============================================================================

# Anima transformer 权重。preview3-base 通常用 anima-preview3-base.safetensors。
transformer_path: "models/transformers/anima-preview3-base.safetensors"

# Qwen-Image / Anima VAE。VAE 不训练，只用于 latent 编码和预览解码。
vae_path: "models/vae/qwen_image_vae.safetensors"

# Qwen3 文本编码器目录。文本编码器冻结；路径错会直接无法编码 prompt。
text_encoder_path: "models/text_encoders"

# T5 tokenizer 目录。Anima 的 LLM adapter 使用 Qwen embedding + T5 token ids。
t5_tokenizer_path: "models/t5_tokenizer"

# ============================================================================
# 数据集与 Caption
# ============================================================================

# 训练集目录。支持图片旁边 .txt/.caption/.json；子目录名前缀如 10_xxx 可做额外 repeats。
data_dir: "./Dataset/your-dataset"

# 正则集目录。空字符串表示不用。小角色集过拟合、背景/姿势被记死时可启用。
reg_data_dir: ""

# 正则集每张图重复次数。调大：更强防过拟合，但会冲淡角色/风格；调小：主体拟合更快。
reg_repeats: 1

# 正则集统一 caption。留空则读取正则图自己的 caption。
reg_caption: ""

# 训练分辨率。Anima 原生 1024；调高吃显存且慢，调低可能损失细节/光照层次。
resolution: 1024

# 全局重复次数。调大等价增加每 epoch 步数；小数据集可用，但太大会让 epoch 统计失真。
repeats: 1

# 打乱 caption tag。开启能减少固定 tag 顺序记忆；角色触发词需要配合 keep_tokens 保护。
shuffle_caption: true

# 保留前 N 个 tag 不打乱。1-2 常用于角色名/触发词；太大则削弱 shuffle 泛化收益。
keep_tokens: 1

# 水平翻转增强。开启增加数据多样性；左右不对称角色、文字、单边装饰明显时建议关闭。
flip_augment: true

# 每个 tag 随机丢弃概率。0.03-0.08 常用于防止提示词死记；过高会降低 prompt 服从。
tag_dropout: 0.04

# 优先读取 JSON caption。JSON 可分组 shuffle appearance/tags/environment；TXT 更简单。
prefer_json: true

# 缓存 VAE latent。开启后训练更快；首次编码耗时。开启 flip_augment 时本补丁会翻转 latent。
cache_latents: true

# ============================================================================
# LoRA / LoKr
# ============================================================================

# "lora" 更稳、参数少；"lokr" 表达力更强，适合复杂风格/多角色，但更容易过拟合。
lora_type: "lokr"

# rank 容量。调大：更能记复杂特征，也更易记死；调小：泛化好但可能欠拟合。
# Anima 官方 LoRA tips 提到 rank 32 可作为轻量起点。SimpleTuner/Ostris 经验：
# Qwen-Image 上 rank≥64 通常无收益甚至有害；rank 32 是上限附近的甜区。
lora_rank: 32

# alpha 控制实际缩放 alpha/rank。LoRA 通常等于 rank。
# ⚠ LoKr 不同：Kronecker 已放大表达力，alpha=rank 在小数据集容易过强；
#   LyCORIS 文档推荐 LoKr 用 alpha=1.0；alpha=rank 时建议配合更短训练步数。
lora_alpha: 32.0

# LoRA/LoKr 输出 dropout（作用在 down 输入上）。0.03-0.08 常用；太高会欠拟合。
lora_dropout: 0.05

# rank 维度 dropout（kohya sd-scripts，PR #2046）。训练时随机置零 rank 通道，
# inverted dropout 自动放缩。0.1-0.3 适合小数据集抗过拟合；与 lora_dropout 可叠加。
# 大数据集若 loss 已平稳不必启用；小数据集失败模式（特征过强）的首选工具。
rank_dropout: 0.0

# 整模块 dropout。训练时整层 LoRA 输出置零，等效随机"关闭"该层。
# 0.05-0.15 用于小数据集；与 rank_dropout 可叠加但不要都设很高，否则严重欠拟合。
module_dropout: 0.0

# LoKr Kronecker factor。8 是折中值；更大表达力/参数更多。
# 当前实现：标量 factor + _find_factor 自动降级到 [target,4,2,1] 中能整除的最大值。
# 不支持 LyCORIS 的 (a,b,c,d) 非方形分解，也未实现 use_tucker / decompose_both。
lokr_factor: 8

# 从已有 LoRA/LoKr 权重继续训练。空字符串表示不用。
resume_lora: ""

# 是否应用 T5 token 权重，例如 (tag:1.2)。关闭会更接近普通 tag，但损失权重提示能力。
# 仅在 llm_adapter 实际存在且形状匹配时生效（代码 ~line 5213）。
use_t5_token_weights: true

# ── 模块选择（regex，re.fullmatch） ─────────────────────────────────────
# 默认排除规则：[r".*llm_adapter.*"]。Anima 作者 tdrussell 公开建议不要训 llm_adapter，
# 因为该层桥接 Qwen3 文本嵌入到 cross-attn，含大量预训练知识，易在小 LR 下退化。
# 但用户实证：在 Prodigy + Schedule-Free + huber 组合下，训 llm_adapter 反而能让
# 小数据集更快收敛（约 -25% 步数）且泛化更好。两种说法都成立，取决于训练动力学。
#
# include 优先级高于 exclude（在 _should_inject 中先检查 exclude，命中后再用 include 解禁）。
# 不要写 prefix（旧字段），统一用 regex 模式。
lora_exclude_patterns:
  - ".*llm_adapter.*"           # 默认排除；要训 llm_adapter 时清空此列表

lora_include_patterns: []       # 例：[".*llm_adapter.*"] 强制纳入即使 exclude 命中

# ── 模块级 rank/lr 控制（regex → 值） ────────────────────────────────────
# reg_dims：把特定模块覆盖为更低/更高 rank，常用于"软限制"特定子结构。
# 例：cross_attn 用低 rank 防特征记死；llm_adapter 解禁但限制为 8。
lora_reg_dims: {}
# 示例：
# lora_reg_dims:
#   ".*self_attn.*":  16
#   ".*cross_attn.*": 8
#   ".*mlp.*":        16
#   ".*llm_adapter.*": 8

# reg_lrs：模块级绝对 LR。
# ⚠ ProdigyPlus 下慎用：Prodigy 期待所有 group lr=1.0 由 d 自适应；
#   设非 1.0 会被 Prodigy d 估计覆盖，效果不可预测。
#   仅在 AdamW/AdamW8bit 时有意义。
lora_reg_lrs: {}

# LoRA+（PR by frothmoon, NeurIPS 2024 inspired）：B 矩阵（lora_up/lokr_w2_b）
# 使用更高 LR，加速从零起步的收敛。原论文 SDXL 推荐 16，Flow Matching 社区收敛在 4-8。
# ⚠ 与 ProdigyPlus 冲突：Prodigy d 是全局自适应，ratio 表现为 group["lr"] 的绝对值，
#   会被 Prodigy 内部状态覆盖。**用 ProdigyPlus 时保持 1.0**；只在 AdamW 启用。
loraplus_lr_ratio: 1.0

# ============================================================================
# 基础训练计划
# ============================================================================

# epoch 上限。使用 ProdigyPlus 时更建议靠 max_steps/save_every_steps 观察，而不是只看 epoch。
epochs: 200

# 最大 optimizer step；0 表示不限制。小数据集建议明确设置，如 800/1200/1600 做对比。
max_steps: 0

# 单步 batch。调大梯度更稳、Prodigy 估计更稳，但吃显存；batch 1 时建议 grad_accum 补足。
batch_size: 4

# 按真实图片数做精确累积。0=关闭，使用 grad_accum；>0 时 DataLoader 会在窗口边界
# 拆分同桶 micro-batch，确保每个 optimizer.step() 来自该数量的图片均值梯度。
# 适合 Lion/C-Lion 在分辨率桶很碎、小 batch 很多时稳定方向；不会丢图、补图或二次裁切。
effective_batch_size: 0

# 梯度累积。有效 batch=batch_size*grad_accum；调大会变稳但响应变慢。
# 当 effective_batch_size > 0 时会被忽略。
grad_accum: 1

# 对 ProdigyPlus 必须保持 1.0；实际步长由 d/d0/d_coef 自适应。
# AdamW/AdamW8bit 时才是常规学习率，例如 1e-4 或更低。
learning_rate: 1.0

# ProdigyPlus + Schedule-Free 用 none。AdamW 可用 cosine/cosine_with_restart。
lr_scheduler: "none"

# cosine_with_restart 首次周期 step。太短会频繁重启，可能干扰 Prodigy。
lr_scheduler_t0: 500

# 每次 restart 周期倍数。只在 lr_scheduler: cosine_with_restart 时有效。
lr_scheduler_t_mult: 2.0

# scheduler 最低学习率。只在 AdamW 调度时有意义。
lr_scheduler_eta_min: 0.0

# 顶层 weight_decay。optimizer_args.weight_decay 若存在会覆盖它。
# LoKr w1 会被参数组排除 weight decay；过大 WD 会削弱拟合。
weight_decay: 0.0

# 外部梯度裁剪。ProdigyPlus 文档提示外部裁剪可能阻碍步长估计；用 ProdigyPlus 建议 0。
grad_clip_max_norm: 0

# bf16 通常优先；fp16 更容易溢出；"no" 最稳但慢且吃显存。
mixed_precision: "bf16"

# 梯度检查点。开启省显存但变慢；显存足够时关闭更快。
grad_checkpoint: false

# xformers attention。Windows/新卡上不一定稳定；不确定先 false。
xformers: false

# DataLoader workers。Windows 建议 0；Linux 可试 2-4。
num_workers: 0

# ============================================================================
# Optimizer 选择与 ProdigyPlusScheduleFree 全参数
# ============================================================================

# "prodigyplus" / "adamw" / "adamw8bit" / "soap"。
optimizer_type: "prodigyplus"

# 旧字段兼容：仅当 optimizer_args 未给 d0/use_stableadamw 时作为兜底。
prodigyplus_d0: 1.0e-6
prodigyplus_use_stableadamw: true

# optimizer_args 会直接传入 create_optimizer，再由 optimizer_utils 按当前安装版本签名过滤。
# 未被当前 ProdigyPlus 版本支持的 key 会 warning 后丢弃，不会中断训练。
optimizer_args:
  # lr 是 Prodigy 的倍率入口，官方建议 1.0。小于 1 会让整体有效 LR 被压低，常见表现是不学。
  lr: 1.0

  # betas=(beta1,beta2)。beta1 越大，Schedule-Free 平均更强，样本更稳但响应慢。
  # PyPI tips 提到 Schedule-Free 常可试 [0.95,0.99]；LoRA 基线先用 [0.9,0.99]。
  betas: [0.9, 0.99]

  # beta3 是 Prodigy 的第三动量/估计平滑项。null 通常由库取 sqrt(beta2)。
  # 调低：d 响应更快但更抖；调高：更稳但可能起步慢。
  beta3: null

  # eps。正数时是传统 AdamW 分母稳定项；null 启用 Adam-atan2，尺度不敏感，bf16 友好。
  # 如果 use_focus=true，官方说明与 Adam-atan2 不兼容，需设正数 eps。
  eps: null

  # weight_decay。调大可抗过拟合，但会削弱角色/风格拟合；LoRA/LoKr 常从 0 或 0.01 试。
  weight_decay: 0.0

  # weight_decay_by_lr 是旧/兼容字段：让 WD 随有效 LR 缩放。开启后 WD 在自适应 LR 下更自然。
  # 新版文档/代码可能使用 decouple_lr 替代；不确定版本时二者不要同时乱开。
  weight_decay_by_lr: false

  # decouple_lr 是新版替代字段，若当前安装版本支持会生效；不支持会被过滤。
  # 开启可能让 WD 与 Prodigy 内部 LR 解耦/行为更接近新版设计；基线保持 false。
  decouple_lr: true

  # d0 是初始有效 LR 估计。太小：前几百步几乎不动；太大：早期过冲、颜色/构图崩。
  # 若 200-300 step 不学习，优先试 2e-6、5e-6、1e-5。
  d0: 1.0e-6

  # d_coef 控制 d 增长力度。你的 SDXL LoRA 经验表明 <1 会不学；这里基线用 1。
  # 调大到 1.5/2：更快起步，也更容易过冲；复杂集可小幅试，简单集谨慎。
  d_coef: 1.0

  # d_limiter 限制 d 单步增长。开启更稳、防早期高估；若完全不学习，可关掉。
  d_limiter: true

  # safeguard_warmup 是旧版/兼容 warmup 安全项；开启更稳但会拖慢起步。
  # 当前 optimizer 版本不支持时会被过滤。
  safeguard_warmup: false

  # prodigy_steps：第 N 步后冻结 Prodigy 的 LR 估计并释放部分状态。
  # 0/null=不冻结。可设总步数 20-30%，如 400/500，减少后期 d 继续涨。
  prodigy_steps: 0

  # use_schedulefree：true = Prodigy + Schedule-Free，不需要外部 scheduler。
  # false = 近似纯 Prodigy，最好配合 cosine/linear 衰减；本训练器默认建议 true。
  use_schedulefree: true

  # schedulefree_c 控制 Schedule-Free 平均强度。0/null 通常用库默认。
  # 调大：平均更强、泛化可能更稳，但拟合/响应更慢。
  schedulefree_c: 0

  # use_stableadamw：内部更新缩放，减少外部 grad_clip 需求。
  # true 更稳；false 更自由，可能需要外部 grad_clip，且 d 估计更敏感。
  use_stableadamw: true

  # use_bias_correction：Adam bias correction。true 更传统但 Prodigy 起步常变慢。
  use_bias_correction: false

  # factored：二阶矩低秩/分解近似，省显存。LoRA 参数少时收益有限；复杂参数组可试 true。
  factored: false

  # factored_fp32：factored=true 时用 fp32 保存统计量。更稳但稍占显存；bf16 下建议 true。
  factored_fp32: true

  # stochastic_rounding：随机舍入，低精度下可减少累积偏差；也可能引入不可复现噪声。
  stochastic_rounding: false

  # fused_back_pass：融合反传以省显存。需要训练框架显式支持；不支持时打开可能不生效或出错。
  fused_back_pass: false

  # split_groups：每个参数组单独自适应 LR。本训练器 LoKr 有 decay/no_decay 分组；true 更精细。
  # false 更接近原始 Prodigy，全组共用估计，可能更稳但不够灵活。
  split_groups: true

  # split_groups_mean：true 复制旧版行为，按组均值同步；false 是 v2 默认的逐组完整适配。
  split_groups_mean: false

  # use_adopt：延迟二阶矩更新。小/噪声数据集可能更稳；也可能使起步更慢。
  use_adopt: false

  # use_cautious：只强化与梯度方向一致的更新。可能提高稳定/收敛，收益不固定。
  use_cautious: false

  # use_orthograd：使用相对权重方向的正交梯度分量。可抗过拟合/提升泛化，也可能削弱角色记忆。
  use_orthograd: false

  # use_grams：按动量/梯度幅度调整更新方向。实验项，收益不稳定。
  use_grams: false

  # use_speed：替换 Prodigy d 估计为 SPEED。官方说多网络训练可能更好；长训/WD 下可能不稳。
  # 若 d 长期不涨、又不想提高 d0/d_coef，可单独试 true。
  use_speed: false

  # use_focus：大步长噪声处理实验项。与 factored、Adam-atan2(eps:null) 不兼容。
  # 若要试：factored=false 且 eps=1e-8。
  use_focus: false

# ── SOAP 参考配置（optimizer_type: "soap" 时使用）────────────────────────
# SOAP = Shampoo preconditioner + Adam in Shampoo eigenbasis。它不自动估计全局 LR，
# 因此更适合当前这种 timestep / aux loss / loss weighting 都很实验性的训练环境：
# 宏观步长仍由 learning_rate + scheduler 控制，优化器只负责矩阵方向预条件。
#
# 推荐首跑：
# optimizer_type: "soap"
# learning_rate: 2.0e-5
# lr_scheduler: "cosine"
# lr_scheduler_eta_min: 2.0e-6
# grad_clip_max_norm: 1.0
# loraplus_lr_ratio: 1.0
# optimizer_args:
#   betas: [0.95, 0.95]          # Adam 动量与二阶矩；SOAP 论文常用较低 beta2
#   shampoo_beta: -1             # -1 表示复用 beta2
#   eps: 1.0e-8
#   weight_decay: 0.01
#   precondition_frequency: 10   # 每 N 步更新一次 eigenbasis；越小越贵但反应快
#   max_precond_dim: 512         # 首跑安全值；稳定但偏弱时再试 1024
#   precondition_1d: false       # DoRA scale 等 1D 参数退化为 Adam-like 更新
#   normalize_grads: false       # true 会抹掉部分 loss 权重幅度信息，首跑关闭
#   correct_bias: true
#   merge_dims: false            # LoKr 矩阵保持原形状，不合并维度

# ============================================================================
# Flow Matching / timestep / 噪声增强 / loss 权重
# ============================================================================

# flow_shift：作用在模型/scheduler 端的 sigma 调度偏移（影响真实噪声幅度）。
# Anima 默认 1.0，社区/SD3 风格常用 3.0。调大：更重结构/全局；调小：更重低噪声细节。
flow_shift: 3.0

# schedule_shift：作用在 t 采样分布端的 SD3-style shift（影响采样分布形状）。
# ⚠ 与 flow_shift 是两个独立旋钮，不要混淆。
# - logit_normal:     shift>1 把 t 推向 1（高噪声/结构）
# - logit_normal_low: shift>1 把 t 推向 0（低噪声/细节）
# - shift=1.0 时两个分布退化为同一对称 sigmoid(N(0,1))；此时 mixed_uniform_low
#   实际上 = mixed_uniform_logit，"_low" 子分布 **失效**。要让 _low 真正偏低 t，
#   必须 schedule_shift > 1（例如 1.5-2.0）。
schedule_shift: 1.0

# timestep_sampling:
#   logit_normal           默认，中段为主，shift>1 偏高 t。
#   uniform                均匀覆盖；细节端覆盖更多但收敛可能慢。
#   logit_normal_low       配合 shift>1 偏低 t/细节，适合细节欠拟合实验。
#   mode                   SD3 mode distribution，集中在某 sigma 附近，实验项。
#   mixed_uniform_low      uniform 与 logit_normal_low 的混合（按 timestep_mix_low_prob）。
#                          schedule_shift=1 时 = mixed_uniform_logit。
#   mixed_uniform_logit    uniform 与 logit_normal 的混合。
timestep_sampling: "logit_normal"

# 混合采样的 _low 子分布权重（仅 mixed_* 模式）。0.10-0.20 常用。
timestep_mix_low_prob: 0.15

# loss_weighting_scheme:
#   none           基线，不加权。
#   min_snr        下调"几乎无噪声/高 SNR"的简单步，需 min_snr_gamma>0；常用 gamma=5。
#   max_snr_inv    下调极高噪声/低 SNR 步，少用。
#   logit_normal   抵消采样分布偏置，实验项。
#   sigma_sqrt     w=sqrt(t)，缓解 t→0 处梯度爆点（非 SD3 原版）。
#   sigma_sqrt_sd3 SD3 论文 Eq.6 原版 w=sigma^-2。**仅适合 batch≥64**；
#                  小 batch + Prodigy 会被单样本主导导致 d 估计崩坏。
#   detail_inv_t   w=clip(1/t, 1, 5)；温和细节端强化，与小 batch + Prodigy 兼容。
#                  ⚠ 与 huber_schedule="snr" 叠加会双重加强低 t/高 SNR 信号，
#                    在小数据集（≤60）易导致"线条锁死、面部/背景崩坏"。
#   cosmap         SD3 cosmap weighting，对中间 t 友好，max/min ≈ 1.81。
loss_weighting_scheme: "none"

# min_snr_gamma。仅 loss_weighting_scheme=min_snr/max_snr_inv 时使用；常用 5。
min_snr_gamma: 0.0

# weight_cap_ratio：单 batch 内 max(w)/min(w) 硬上限。0=禁用，>1.0=启用。
# 用途：保护 ProdigyPlus d 估计不被极端样本权重主导。
# detail_inv_t / sigma_sqrt_sd3 / cosmap 等放大方差的方案配合 5-10 较稳。
# 注意 detail_inv_t 自身已 clamp 到 [1,5]，weight_cap_ratio 是叠加保险。
weight_cap_ratio: 0.0

# loss_type:
#   mse / l2     默认；标准做法。
#   l1 / mae     更鲁棒于离群梯度，但收敛更慢。
#   huber        小残差走 L2 / 大残差走 L1；huber_c 是切换阈值。
#   smooth_l1    与 huber 类似但归一化方式不同（PyTorch 标准 SmoothL1）。
loss_type: "mse"

# huber/smooth_l1 的 delta 阈值。0.10-0.25 常用；越小越接近 L1（越鲁棒越糊）。
# Flux 社区经验：0.15-0.25 + huber_schedule="snr" 是稳定组合。
huber_c: 0.1

# huber_schedule:
#   constant     delta 固定为 huber_c，最简单。
#   snr          delta = huber_c * sqrt(SNR(t))；高 SNR/低 t 更 L2 化（保细节），
#                高噪声/低 SNR 更 L1 化（抗离群）。kohya scheduled-Huber PR#1228。
#   sigma        delta = huber_c * t（线性按 sigma 缩放）。
#
# ⚠ huber_schedule="snr" + loss_weighting_scheme="detail_inv_t" 叠加风险：
#   两者都加重低 t/高 SNR 端的影响，小数据集可见"细节过拟合"。择一即可。
huber_schedule: "constant"

# noise_offset：低频亮度噪声偏移。对"明暗对比训练出来变平"针对性强。
# 0.03-0.08 常用；>0.15 可能导致偏色/脏。
noise_offset: 0.0625

# 随机缩放 noise_offset。开启时实际幅度从 [noise_offset_min, noise_offset] 均匀采样。
noise_offset_random_strength: false

# noise_offset_random_strength=true 时的随机下限。默认 0 兼容旧行为；
# 设 0.02-0.03 可避免随机抽到过弱的 offset（信号"偶尔失效"）。
noise_offset_min: 0.0

# pyramid_noise_iterations：多尺度低频噪声层数。可强化全局光照/构图。
# 0=关闭；若光照仍平，可试 4-8；太高会让训练目标偏低频。
# 当前实现使用 bilinear 插值（非 nearest），避免规则结构（扣子/文字/网格）变形。
pyramid_noise_iterations: 0

# pyramid_noise_discount：每层衰减。0.2-0.4 较稳；越高低频影响越强。
pyramid_noise_discount: 0.3

# caption_dropout_rate：整条 caption 置空概率，训练无条件分支，提升 CFG 表现。
# 0.03-0.08 常用；>0.2 容易学不到具体内容。
caption_dropout_rate: 0.05

# ============================================================================
# 输出 / 保存 / 断点
# ============================================================================

output_dir: "./output/all_args_test"
output_name: "anima_lokr_all_args"

# 每 N epoch 保存；0=关闭。更建议用 save_every_steps。
save_every: 0

# 每 N optimizer step 保存 LoRA。建议与 sample_steps 对齐，方便选 checkpoint。
save_every_steps: 100

# 每 N step 保存完整训练状态。可断点续训，但文件更大。
save_state_every: 500

# 从完整训练状态恢复。空字符串表示不用。
resume_state: ""

# 随机种子。固定可复现预览；不同 seed 可检查泛化稳定性。
seed: 42

# ============================================================================
# 训练中采样
# ============================================================================

# 每 N epoch 采样；0=关闭。建议用 sample_steps。
sample_every: 0

# 每 N step 采样。过小会拖慢训练；40-200 适合观察小数据集过拟合点。
sample_steps: 100

# 单 prompt 采样。若 sample_prompts 非空，通常会轮换多 prompt。
sample_prompt: "newest, safe, 1girl, masterpiece, best quality"

# 多 prompt 轮换，用于检查训练集内/外、明暗、复杂构图泛化。
sample_prompts:
  - "newest, safe, 1girl, masterpiece, best quality"
  - "newest, safe, 1girl, cinematic lighting, backlit, detailed background"
  - "newest, safe, 1girl, bright sunlight, outdoor, dynamic pose"

# CFG。Anima 常用 3.5-5。过高会硬、糊或过饱和；过低 prompt 服从弱。
sample_cfg_scale: 4.0

# 负面 prompt。空字符串表示代码默认/无负面，视 sample_image 实现而定。
sample_negative_prompt: ""

# 采样宽高。0=跟随 resolution；建议用与正式推理相同尺寸比较。
sample_width: 0
sample_height: 0

# 采样 seed。0=每次随机；固定值便于横向比较 checkpoint。
sample_seed: 42

# 采样步数。与 ComfyUI 正式工作流对齐；25 是常用起点。
sample_infer_steps: 25

# 采样器/调度器。用于和 ComfyUI Anima 流程对齐。
sample_sampler_name: "er_sde"
sample_scheduler: "simple"

# ============================================================================
# 进度 / 日志 / Web 监控
# ============================================================================

# loss 曲线保留最近 N 点。太大无害但 UI 更重。
loss_curve_steps: 200

# 关闭进度条。云端日志很乱时可 true。
no_progress: false

# 每 N step 打印日志。调小更详细，略影响速度。
log_every: 10

# 关闭 Web 监控。无浏览器/纯终端训练可 true。
no_monitor: false

# 监控地址。127.0.0.1 更安全；云端需要外部访问可 0.0.0.0，但注意无鉴权。
monitor_host: "127.0.0.1"

# 监控端口。
monitor_port: 8765

# 不自动打开浏览器。服务器/云端建议 true。
no_browser: true

# ============================================================================
# 命令行专用参数提示
# ============================================================================
# 以下参数由 argparse 支持，但不是 YAML mapping 的训练超参：
#   --config              指定 YAML 路径。
#   --auto-install        自动安装缺失依赖。
#   --interactive         交互式补齐缺失参数。
#   --no-t5-token-weights 等价于把 use_t5_token_weights 设为 false。

# ============================================================================
# 已知交互/坑位汇总（写在最后便于对照）
# ============================================================================
# 1. flow_shift（模型/scheduler 端） vs schedule_shift（采样分布端）是两个独立旋钮。
#    schedule_shift=1.0 时 logit_normal_low 退化为 logit_normal，"_low" 失效。
#
# 2. detail_inv_t × huber_schedule="snr" 叠加 → 低 t/高 SNR 端被双重加强；
#    小数据集（≤60）的"线条锁死、面部/背景崩"很多来自这种叠加。择一使用。
#
# 3. ProdigyPlus + Schedule-Free 下：
#    - learning_rate 必须 1.0
#    - lr_scheduler 必须 "none"（启用 use_schedulefree 时代码会自动禁用 cosine）
#    - loraplus_lr_ratio 与 lora_reg_lrs 几乎无效（被 Prodigy d 全局覆盖）
#    - grad_clip_max_norm 建议 0（外部裁剪会扰乱 d 估计）
#
# 4. cache_latents=true + flip_augment=true：翻转只在缓存构建时生效一次，
#    不是每 epoch 随机翻转；想要随机翻转请关 cache_latents。
#
# 5. lora_alpha：LoRA 推荐 = rank；LoKr 因 Kronecker 已放大表达力，
#    LyCORIS 文档推荐 alpha=1.0。alpha=rank 时小数据集易过强。
#
# 6. llm_adapter：默认排除（Anima 作者建议）。要训：
#    lora_exclude_patterns: []  # 或保留并用 include 覆盖
#    lora_include_patterns: [".*llm_adapter.*"]
#    lora_reg_dims: { ".*llm_adapter.*": 8 }   # 软限制容量
#
# 7. mixed_uniform_low 在小 batch + 强 detail 权重下波动很大，
#    若用 batch_size=2，建议 weight_cap_ratio=5-10 或换 batch_size=4。
#
# 8. 当前 LoKr 实现是自研（非 LyCORIS 原生）：
#    - 无 use_tucker / decompose_both / 非方形 (a,b,c,d) 分解
#    - 自动 _find_factor 降级
#    - ComfyUI 键名兼容（lokr_w1/w2_a/w2_b）
#    小数据集若失败模式难解，可考虑后续接入 lycoris-lora 拿 Tucker 收益。
