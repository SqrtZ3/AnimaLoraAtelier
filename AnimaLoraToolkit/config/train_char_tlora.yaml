# ════════════════════════════════════════════════════════════════════════════
# 角色训练·T-LoRA×LoKr 变体 —— train_char.yaml 的单开关变体（2026-06）
# 唯一差异：lora_variant dora→tlora（+ tlora 三件套）。其余逐行一致，
# 专为与 train_char.yaml 的 run 做干净 A/B。
#
# 机制：训练期按 timestep 动态降有效 rank（power_law 调度，t→1 降到
# rank×rmin_ratio，t→0 满 rank）。对症两件事：
#   ① 高噪段 = 构图/背景记死的主源（T-LoRA AAAI 2026 实证）→ 压角色过拟合
#   ② 画风也写在高噪段（goutong 扫描 t≈0.95）→ t 轴再压"吸画风"，
#      与 14-20 block 倾斜（block 轴）正交互补
#
# 导出（2026-06-12 读码 + ortho 修复后复核）：ortho_init=false + native ⇒
# 训练动态 mask、导出满 rank 烘焙成标准 LoKr key（bf16，lycoris.kohya），
# ComfyUI 标准 loader 直载，体积≈普通 LoKr（~20MB），与训练语义严格自洽。
# ortho_init=true 的一致性 bug 已修（tests/test_tlora_lokr_ortho_consistency.py），
# 但其净 ΔW 是两个 kron 之差、无法表达为标准 LoKr key，只能配 diff/
# merged_model 导出（native 组合构造期 raise）→ 要 ComfyUI 直载就保持 false。
#
# 预览注意：训练内预览采样逐步应用动态 mask，ComfyUI 成品是满 rank ——
# 预览与成品有微小系统差，最终验收以 ComfyUI 出图为准。
# 判读抓手（vs train_char.yaml 同数据 run）：中高 t eval 见底更晚=①生效；
# 无画风 prompt 时画风更干净=②生效；同时盯身份识别细节是否变弱（mask 只
# 压高噪、低 t 满 rank，理论上不伤识别细节带）。
# ════════════════════════════════════════════════════════════════════════════

# ── 模型路径 ──────────────────────────────────────────────────────────────
transformer_path: "AnimaLoratoolkit/models/transformers/anima-base-v1.0.safetensors"
vae_path: "AnimaLoratoolkit/models/vae/qwen_image_vae.safetensors"
text_encoder_path: "AnimaLoratoolkit/models/text_encoders/Qwen3-0.6B-Base"
t5_tokenizer_path: "AnimaLoratoolkit/models/t5_tokenizer"

# ── 数据集 ────────────────────────────────────────────────────────────────
data_dir: "./Dataset/char-xxx"      # ★必改：角色集（20-50 张，多角度/多构图；避免同姿势重复）
resolution: 1024
repeats: 1

bucket_base_resos: [1024]
bucket_min_base_reso: 0
bucket_max_base_reso: 0
bucket_base_reso_steps: 256
min_bucket_reso: 512
max_bucket_reso: 3072
bucket_reso_steps: 64
bucket_max_aspect_ratio: 2.7
bucket_no_upscale: true
bucket_max_upscale: 0.0
bucket_report: true

max_img_h: 0
max_img_w: 0

shuffle_caption: true
keep_tokens: 1                # trigger 永远第一位
flip_augment: false           # [CHAR] 必关：角色的不对称设计（发饰/挑染/瞳色差/服装纹章）会被翻转毁掉
tag_dropout: 0.1
# 工作流级解绑（universal_v1 同款）：特写子集若打 close-up tag，虹膜/发丝等
# 识别细节会被门控在 tag 后面（v4 实证机制）。无该 tag 的数据集上是无操作。
tag_dropout_overrides:
  close-up: 0.5
prefer_json: false
cache_latents: true

# [CHAR] caption 纪律（不是配置项，是打标规则）：
#   固有特征（发色/瞳色/发型/体型）不写 tag → 绑进 trigger；
#   可变项（服装/姿势/表情/背景）全部写 tag → 保留控制力。换装能力要强就多服装数据。

# ── LoRA / LoKr / T-LoRA ──────────────────────────────────────────────────
lora_type: "lokr"
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0
lokr_factor: 4
# [TLORA] 本变体的唯一开关组（与 train_char.yaml 的差异全在这里）：
lora_variant: "tlora"          # 与 dora 代码级互斥（lora.py raise），本变体弃 dora
dora_export_mode: "native"     # ortho_init=false 时 native = 标准 LoKr key 导出，严格自洽
tlora_lokr_experimental: true  # 显式 opt-in：论文只覆盖 plain LoRA，LoKr 是 in-house 扩展
tlora_lokr_ortho_init: false   # ComfyUI 直载前提下必须 false：w2_b=0 起步天然 ΔW=0；
                               # true 只能配 diff/merged_model 导出（构造期会 raise 拦错配）
tlora_rmin_ratio: 0.5          # 高噪端有效 rank 下限 = 模块 rank×0.5（32→16，倾斜段 16→8）
# tlora_alpha: 1.0             # mask 的 power_law 幂次，默认 1.0 不动

lora_targets:                 # [CHAR] adaln_modulation 与 final_layer 已移除（扫描实证白训）
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "output_proj"
  - "mlp.layer1"
  - "mlp.layer2"

lora_exclude_patterns:
  - ".*llm_adapter.*"

# [CHAR] 基线统一 32（kohya 实证高 rank 反伤细节捕捉）+ 画风隔离倾斜：
# 14-20 是画风主带（goutong 扫描），降 16 减少"把数据集画风吸进角色 LoRA"。
# 与 train_char.yaml 保持一致（tlora 的 r_min 按模块 rank 等比：32→16、16→8）。
# 块段模式必须在通用模式之前（首个 fullmatch 生效；启动日志出现
# [lora_reg_dims] 遮蔽告警务必停下检查）。
lora_reg_dims:
  '.*blocks\.(1[4-9]|20)\..*': 16
  ".*self_attn.*": 32
  ".*cross_attn.*": 32
  ".*mlp.*": 32
lora_reg_alphas:
  '.*blocks\.(1[4-9]|20)\..*': 16
  ".*self_attn.*": 32
  ".*cross_attn.*": 32
  ".*mlp.*": 32

rank_dropout: 0.05
module_dropout: 0.03
loraplus_lr_ratio: 1.0

# ── 优化器：soap_sf（与画风一致）─────────────────────────────────────────
optimizer_type: "soap_sf"
learning_rate: 4e-4
lr_scheduler: "none"

optimizer_args:
  betas: [0.9, 0.95]
  shampoo_beta: -1.0
  eps: 1.0e-8
  weight_decay: 0.01
  precondition_frequency: 5
  max_precond_dim: 10000
  precond_in_state: false
  merge_dims: false
  precondition_1d: false
  normalize_grads: false
  data_format: "channels_first"
  correct_bias: true
  weight_lr_power: 2.0
  r: 0.0
  warmup_steps: 0

epochs: 200
max_steps: 0
batch_size: 4
effective_batch_size: 0
grad_accum: 1
grad_clip_max_norm: 1.0
grad_norm_log_every_steps: 40
mixed_precision: "bf16"
grad_checkpoint: true
num_workers: 4

# ── Timestep / loss ───────────────────────────────────────────────────────
flow_shift: 2.5               # [CHAR] 温和中高噪偏置；不要画风的高噪激进档
timestep_sampling: logit_normal   # [CHAR] 角色不用 U 形：高噪端是构图过拟合主源（T-LoRA 实证）
timestep_stratified: true     # [CHAR/通用] batch=4 分层采样，零开销降梯度噪声
timestep_t_min: 0.05          # [CHAR/通用] 截掉病态低噪端（arXiv 2509.20952），识别细节 0.05-0.25 区间足够
timestep_t_max: 1.0
schedule_shift: 1

adaptive_timestep: true       # 沿用（Exp-03 证 ON 更好；loss-aware 与任务无关）
adaptive_timestep_metric: "entropy_rate"
disable_tlora_hooks: false    # [TLORA] 必须 false：hooks 负责把当前 batch 的 t 喂给动态 mask
use_precommit_lora_forward: false
use_per_block_checkpoint: true
adaptive_timestep_low_noise_gate: true
adaptive_timestep_gate_n: 3.0
adaptive_timestep_gate_c: 0.04
adaptive_timestep_highfreq_weight: 0.14
adaptive_timestep_bins: 8
adaptive_timestep_ema_decay: 0.97
adaptive_timestep_burn_in: 200
adaptive_timestep_min_factor: 0.5
adaptive_timestep_max_factor: 2.5
adaptive_timestep_base_mix: 0.70
adaptive_timestep_candidate_mult: 4

# TREAD：v4 实测永久件（单步 -25%，画质无投诉；token 路由机制任务无关）。
tread_enabled: true
tread_ratio: 0.25
tread_start_layer: 3
tread_end_layer: -4

# LoRA-One init 不要用：in-house 已判否决（commit 08e7797）。保持禁用。
lora_one_init_steps: 0
lora_one_init_scale: 0.01

loss_weighting_scheme: "none"
weight_cap_ratio: 0
min_snr_gamma: 0
detail_inv_t_min: 1.0
detail_inv_t_max: 8.0

noise_offset: 0
noise_offset_min: 0
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3

# [CHAR-实验位·唯一] ΔFM 反发灰项在单角色集的正确形态是 vecor：原 batch 模式
# 在同质集上负样本≈自身 target、排斥项退化；vecor 用合成负样本（通道乱序/
# 裁剪拉伸），不依赖 batch 多样性（packed 路径自动跳过，标准分桶 dense 路径
# 生效）。与 train_char.yaml 保持一致以维持单开关 A/B。注意：部分移植
# （缺论文正向 EMA 项）——身份发糊/发灰/异常时第一个关它（先于 TREAD）。
dfm_lambda: 0.05
dfm_mode: "vecor"

loss_type: "huber"
huber_c: 0.2
huber_schedule: "snr"
huber_snr_clamp_max: 2.0

caption_dropout_rate: 0.01
freq_balanced_dropout_strength: 0.0

# ── 辅助 loss：角色全关（频域 loss 是纹理工具；感知类已证负收益）──────────
aux_spectral_enabled: false
aux_spectral_lambda: 0.065
aux_spectral_use_wavelet: false
aux_spectral_wavelet_lambda: 0.20   # 关着；若开按 universal_v1 保守档（0.30 有斑块前科）
aux_spectral_t_gate: 0.55

aux_perceptual_enabled: false
aux_perceptual_lambda_lpips: 0.10
aux_perceptual_lambda_dino: 0.01
aux_perceptual_t_gate: 0.4
aux_perceptual_lpips_net: "vgg"
aux_perceptual_dino_local_path: ""
aux_perceptual_cache_dir: "AnimaLoraToolkit/models/perceptual"
aux_perceptual_use_checkpoint: true
aux_perceptual_lpips_size: 512

# ── eval（与画风线同网格，跨 run 跨任务可比）──────────────────────────────
# 盲区提醒（v4 实证）：低 t eval 只度量拟合，识别细节的生成端表现要靠预览判。
# 角色线重点盯中高 t 曲线是否过早见底 = 构图/背景记死（角色过拟合主征兆）；
# 本变体预期它比 dora 版见底更晚——这正是 ① 的判据。
eval_every_steps: 40
eval_count: 4
eval_t_grid: "0.1,0.3,0.5,0.7,0.9"
eval_seed: 1234

# ── 输出 ──────────────────────────────────────────────────────────────────
output_dir: "./output/char-xxx-tlora"      # ★必改
output_name: "char-xxx-anima-tlokr"        # ★必改

save_every_steps: 40
save_state_every_steps: 200
keep_vae_on_gpu: true
empty_cache_after_sample: false
seed: 42
resume_lora: ""

sample_every_epochs: 0
sample_every_steps: 40
sample_infer_steps: 25
sample_cfg_scale: 4.0
sample_sampler_name: "er_sde"
sample_scheduler: "beta"      # 对齐推理端/画风线
sample_width: 0
sample_height: 0
sample_seed: 1234
sample_negative_prompt: ""
sample_prompt: "@ch4rtrigger, newest, safe, 1girl, masterpiece, best quality"  # ★必改 trigger

loss_curve_steps: 1
no_progress: false
log_every_steps: 1

no_monitor: false
monitor_host: "0.0.0.0"
monitor_port: 8765
no_browser: true
