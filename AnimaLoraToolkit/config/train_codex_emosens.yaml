# Anima LoKr + EmoSens baseline
# Copy this file and adjust model/data/output paths before training.

transformer_path: "models/transformers/anima-preview3-base.safetensors"
vae_path: "models/vae/qwen_image_vae.safetensors"
text_encoder_path: "models/text_encoders"
t5_tokenizer_path: "models/t5_tokenizer"

data_dir: "./Dataset/your-dataset"
resolution: 1024
repeats: 1
shuffle_caption: true
keep_tokens: 1
flip_augment: true
tag_dropout: 0.04
prefer_json: true
cache_latents: true

lora_type: "lokr"
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.05
lokr_factor: 8
use_t5_token_weights: true

# EmoSens is loss-sequence driven and writes dynamic LR internally.
# Keep lr_scheduler disabled. Upstream recommends DiT LoRA lr_scope around 0.1.
optimizer_type: "emosens"
learning_rate: 0.1
optimizer_args:
  betas: [0.9, 0.995]
  eps: 1.0e-8
  weight_decay: 0.0
  stopcoef: 0.04
  use_shadow: false
  notify: false

epochs: 200
max_steps: 0
batch_size: 4
grad_accum: 1
lr_scheduler: "none"
weight_decay: 0.0
grad_clip_max_norm: 1.0
mixed_precision: "bf16"
grad_checkpoint: false
xformers: false
num_workers: 0

flow_shift: 3.0
timestep_sampling: "logit_normal"
loss_weighting_scheme: "none"
min_snr_gamma: 0.0
noise_offset: 0.0625
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3
caption_dropout_rate: 0.05

output_dir: "./output/codex_emosens"
output_name: "anima_lokr_emosens"
save_every: 0
save_every_steps: 100
save_state_every: 500
seed: 42

sample_every: 0
sample_steps: 100
sample_infer_steps: 25
sample_cfg_scale: 4.0
sample_sampler_name: "er_sde"
sample_scheduler: "simple"
sample_width: 0
sample_height: 0
sample_seed: 42
sample_negative_prompt: ""
sample_prompt: "newest, safe, 1girl, masterpiece, best quality"

loss_curve_steps: 200
no_progress: false
log_every: 10
no_monitor: false
monitor_host: "127.0.0.1"
monitor_port: 8765
no_browser: true
