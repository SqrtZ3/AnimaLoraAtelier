# ══════════════════════════════════════════════════════════════════
# Krea 2 · 消融 Run A：基线 + 只开 navit（2026-07-11）
#
# 与已拟合的 train_krea2_minimal_diag.yaml 相比，**只改一个变量**：
#   navit_packing: false → true（budget 16384 ≈ 4 图/包 @1024²，
#   与基线 batch_size 4 的每步图数对齐；multiscale/native 保持关）
#
# 目的：把"之前所有失败组合"里的 navit 因素单独拎出来测。
#   · Run A 拟合（步调与基线相当）→ navit 洗清嫌疑，吞吐可以拿回来，
#     嫌疑集中到 1536 分布外桶 + 实验优化器/结构栈。
#   · Run A 不拟合 → navit 的云端路径有问题（本地 packed≡dense 1.4e-6
#     已验证，那就要查云端特有分支：xformers varlen、逐图 res-shift、
#     text 打包），回来报告，别再叠加变量。
#
# 判读与基线同口径：step0 采样正常性 / grad_norm / eval_loss t=0.5、0.9
# 下降斜率 / 预览拟合步调。对照时用与基线相同的 step 数比较。
# 其余所有参数与 train_krea2_minimal_diag.yaml 逐项相同，勿动。
# ══════════════════════════════════════════════════════════════════

# ── 模型路径 ────────────────────────────────────────────────
model_family: "krea2"
transformer_path: "AnimaLoratoolkit/models/transformers/raw.safetensors"
vae_path: "AnimaLoratoolkit/models/vae/qwen_image_vae.safetensors"
krea2_text_encoder_path: "AnimaLoratoolkit/models/text_encoders/Qwen3-VL-4B-Instruct"
krea2_text_max_length: 512
krea2_text_cache_entries: 128

# ── 数据集 ──────────────────────────────────────────────────
data_dir: "./Dataset/your-dataset"
resolution: 1024
repeats: 1

# ── ARB 分桶（与基线相同：1024 基准）────────────────────────
bucket_base_resos: [1024]
bucket_min_base_reso: 0
bucket_max_base_reso: 0
bucket_base_reso_steps: 256
min_bucket_reso: 512
max_bucket_reso: 2048
bucket_reso_steps: 64
bucket_max_aspect_ratio: 2.0
bucket_no_upscale: true
bucket_max_upscale: 0.0
bucket_report: true
max_img_h: 0
max_img_w: 0

# ── NaViT：★ 本次唯一改动 —— 打包开，multiscale/native 关 ────
navit_packing: true
navit_native_resolution: false
navit_token_budget: 16384
navit_max_images_per_pack: 0
navit_multiscale: false
navit_pack_strategy: ffd
navit_text_trim_padding: false
fit_packed_training: false
token_bucket: false
bucket_drop_last: false
torch_compile: false
cache_latents: true
cache_encode_tiled: true
cache_encode_max_pixels: 16777216

# ── 数据增强 / 打标（与基线相同）────────────────────────────
shuffle_caption: true
keep_tokens: 1
flip_augment: true
tag_dropout: 0.0
caption_dropout_rate: 0.0
freq_balanced_dropout_strength: 0.0
prefer_json: false

# ── LoRA 结构（与基线相同：纯 LoRA rank=alpha=32、263 Linear）────
lora_type: "lora"
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0
lora_init: "default"
lora_variant: "base"
rank_dropout: 0.0
module_dropout: 0.0
loraplus_lr_ratio: 1.0

# ── 优化器（与基线相同：AdamW / 1e-4 恒定）──────────────────
optimizer_type: "adamw"
learning_rate: 1e-4
lr_scheduler: "none"
optimizer_args:
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01

# ── 训练循环（与基线相同）───────────────────────────────────
epochs: 200
max_steps: 0
batch_size: 4
effective_batch_size: 0
grad_accum: 1
grad_clip_max_norm: 1.0
grad_norm_log_every: 20
mixed_precision: "bf16"
grad_checkpoint: true
num_workers: 4

# ── Timestep（与基线相同）───────────────────────────────────
flow_shift: 1.0
timestep_sampling: logit_normal
timestep_stratified: true
timestep_t_min: 0.0
timestep_t_max: 1.0
schedule_shift: 1
krea2_res_shift: true
krea2_shift_min_res: 256
krea2_shift_max_res: 1280
krea2_shift_y1: 0.5
krea2_shift_y2: 1.15
adaptive_timestep: false

# ── 主 loss / 噪声 / 辅助（与基线相同：全部纯净）─────────────
loss_type: "l2"
loss_weighting_scheme: "none"
weight_cap_ratio: 0
min_snr_gamma: 0
noise_offset: 0
noise_offset_min: 0
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3
eisbach_lambda: 0.0
dfm_lambda: 0.0
aux_spectral_enabled: false
lwd_mask_enabled: false
aux_perceptual_enabled: false

# ── eval / 遥测（与基线相同）────────────────────────────────
eval_every: 40
eval_count: 16
eval_t_grid: "0.1,0.5,0.9,0.97"
eval_seed: 1234
telemetry_enabled: true
telemetry_freq_bands: 3
telemetry_slope_window: 6
telemetry_optimizer_every: 0
telemetry_capacity_every: 0

# ── 输出 / 保存 ─────────────────────────────────────────────
output_dir: "./output/krea2-ablate-navit"
output_name: "krea2-ablate-navit"
save_every: 1
save_every_steps: 0
save_state_every: 100
keep_vae_on_gpu: true
empty_cache_after_sample: false
seed: 42
resume_lora: ""
resume_state: ""
stage_timing_every: 20
stage_timing_warmup: 0

# ── 采样出图（与基线相同）───────────────────────────────────
sample_every: 1
sample_steps: 0
sample_infer_steps: 50
sample_cfg_scale: 4.5
sample_sampler_name: "euler"
sample_scheduler: "simple"
sample_width: 0
sample_height: 0
sample_seed: 1234
sample_negative_prompt: ""
sample_prompt: "@g0ut0ng style, 1girl,blue hair,blush,arona (blue archive),classroom"

# ── 日志 / 监控 ─────────────────────────────────────────────
loss_curve_steps: 1
no_progress: false
log_every: 1
no_monitor: false
monitor_host: "0.0.0.0"
monitor_port: 8765
no_browser: true
