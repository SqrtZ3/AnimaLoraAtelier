# ══════════════════════════════════════════════════════════════════
# Krea 2 · AC-LoRA 单变量 A/B（基于 minimal_diag，2026-07-15）
#
# 目的：在**已验证能拟合的 minimal_diag 基线**上，只加两组新开关，做单变量归因：
#   (A) 导出期 SVD 压缩：lora_compress_energy —— 每次 save() 额外写一份逐层变 rank
#       的 .compressed.safetensors 部署件（主件满 rank 不变、供 resume）。
#   (B) AC-LoRA 训练期 RESTART（arXiv:2504.02231）：aclora_enabled —— 每 N 步对
#       每层 A/B 做信号-噪声重置（保留 top 能量分量、丢弃分量重置为同方差噪声）。
#
# ⚠ 单变量纪律：本文件除下面「AC-LoRA / 压缩」小节、output 名外，与
#   train_krea2_minimal_diag.yaml **逐字段一致**。要干净归因就一次只开一组：
#     · 先只开 (A)：aclora_enabled=false，仅看压缩件在你选的 checkpoint 上画质掉多少
#       （energy 0.99/0.95/0.9 三档看采样，本地也可先用 tools/lora_svd_compress.py 试）。
#     · 再只开 (B)：aclora_enabled=true，看它会不会把 krea2 推向欠拟合（见判读 C/E）。
#
# 判读方法（跑之前先记住）：
#   A. step 0 采样必须是正常 krea2 图（RESTART 有 warmup，step 0 天然中立）。
#   B. grad_norm 每 20 步 O(0.1~几)；恒 0 → LoRA 被绕过。
#   C. eval_loss（t=0.5/0.9）应在 500~1500 步内单调下降。★AC-LoRA 风险：它是"降容量"
#      正则器，而 krea2 拟合本就吃紧在"够不够强"这侧（LoKr 容量不足/ABBA 强度不够都失败过）。
#      若开 (B) 后 eval_loss 比基线明显更高/更平、或采样画风更弱 → RESTART 太狠。
#   D. RESTART 日志：每次会打印 "[AC-LoRA] RESTART @ step N：p=... 保留秩 down/up 均值..."。
#      保留秩若长期极低（个位数）→ p 太小/太狠，调 fallback。
#   E. 过拟合冒烟（可选）：小子集 + repeats 30，1000 步看采样是否进训练集特征。
#
# fallback（AC-LoRA 太狠 / 欠拟合时，按顺序放松）：
#   1. 抬 aclora_p_start / p_end（如 0.85→0.995），保留更多能量；
#   2. 拉长 aclora_restart_every（如 200→500），减少扰动频率；
#   3. 抬 aclora_warmup_steps（如 200→800），让信号先充分形成；
#   4. 仍不行 → aclora_enabled=false，只留 (A) 导出压缩（零训练风险的稳压缩收益）。
# ══════════════════════════════════════════════════════════════════

# ── 模型路径 ────────────────────────────────────────────────
model_family: "krea2"
transformer_path: "AnimaLoratoolkit/models/transformers/raw.safetensors"
vae_path: "AnimaLoratoolkit/models/vae/qwen_image_vae.safetensors"
krea2_text_encoder_path: "AnimaLoratoolkit/models/text_encoders/Qwen3-VL-4B-Instruct"
krea2_text_max_length: 512
krea2_text_cache_entries: 128

# ── 数据集 ──────────────────────────────────────────────────
data_dir: "./Dataset/your-dataset"
resolution: 1024
repeats: 1

# ── ARB 分桶（1024 基准 = RAW 分布内）────────────────────────
bucket_base_resos: [1024]
bucket_min_base_reso: 0
bucket_max_base_reso: 0
bucket_base_reso_steps: 256
min_bucket_reso: 512
max_bucket_reso: 2048
bucket_reso_steps: 64
bucket_max_aspect_ratio: 2.0
bucket_no_upscale: true
bucket_max_upscale: 0.0
bucket_report: true
max_img_h: 0
max_img_w: 0

# ── NaViT / FiT 全关（dense ARB 路径）───────────────────────
navit_packing: false
navit_native_resolution: false
navit_token_budget: 16384
navit_multiscale: false
navit_pack_strategy: ffd
navit_text_trim_padding: false
fit_packed_training: false
token_bucket: false
bucket_drop_last: false
torch_compile: false
cache_latents: true
cache_encode_tiled: true
cache_encode_max_pixels: 16777216

# ── 数据增强 / 打标（最小化）────────────────────────────────
shuffle_caption: true
keep_tokens: 1
flip_augment: true
tag_dropout: 0.0
caption_dropout_rate: 0.0
freq_balanced_dropout_strength: 0.0
prefer_json: false

# ── LoRA 结构（官方推荐：纯 LoRA rank=alpha=32、全 264 Linear）──
lora_type: "lora"
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0
lora_init: "default"
lora_variant: "base"
rank_dropout: 0.0
module_dropout: 0.0
loraplus_lr_ratio: 1.0

# ══ AC-LoRA / 导出压缩（本文件相对 minimal_diag 的唯一变量）══════════
# (A) 导出期 SVD 压缩：energy=1.0 为关。想验证压缩画质就设 0.99（每层保留 99% 能量，
#     对应 delta ~10% Frobenius 误差；越低压得越狠）。仅标准 LoRA 可用。
lora_compress_energy: 0.99
lora_compress_max_rank: 0
# (B) AC-LoRA 训练期 RESTART：先设 false 只验 (A)；确认基线不塌后再改 true 验 (B)。
aclora_enabled: false
aclora_restart_every_steps: 200
aclora_warmup_steps: 200
aclora_p_mode: "schedule"       # FM-稳健；论文口径改 "loss"（p=1-l^α，需 loss<1）
aclora_p_start: 0.7
aclora_p_end: 0.99
aclora_p_floor: 0.5
aclora_total_steps: 0           # 0=恒用 p_end（stop-anytime 友好）；填总步数则线性 ramp
aclora_loss_ema_beta: 0.98
aclora_reset_optimizer_state: false
# ════════════════════════════════════════════════════════════════════

# ── 优化器（官方参考：AdamW / 1e-4 / 恒定）─────────────────
optimizer_type: "adamw"
learning_rate: 1e-4
lr_scheduler: "none"
optimizer_args:
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01

# ── 训练循环 ────────────────────────────────────────────────
epochs: 200
max_steps: 0
batch_size: 4
effective_batch_size: 0
grad_accum: 1
grad_clip_max_norm: 1.0
grad_norm_log_every_steps: 20
mixed_precision: "bf16"
grad_checkpoint: true
num_workers: 4

# ── Timestep（官方 krea2_shift = logit_normal + res-shift）───
flow_shift: 1.0
timestep_sampling: logit_normal
timestep_stratified: true
timestep_t_min: 0.0
timestep_t_max: 1.0
schedule_shift: 1
krea2_res_shift: true
krea2_shift_min_res: 256
krea2_shift_max_res: 1280
krea2_shift_y1: 0.5
krea2_shift_y2: 1.15
adaptive_timestep: false

# ── 主 loss（官方 flow-matching = 纯 MSE）───────────────────
loss_type: "l2"
loss_weighting_scheme: "none"
weight_cap_ratio: 0
min_snr_gamma: 0

# ── 噪声 / 辅助 loss 全关 ───────────────────────────────────
noise_offset: 0
noise_offset_min: 0
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3
eisbach_lambda: 0.0
dfm_lambda: 0.0
aux_spectral_enabled: false
lwd_mask_enabled: false
aux_perceptual_enabled: false

# ── eval ────────────────────────────────────────────────────
eval_every_steps: 40
eval_count: 16
eval_t_grid: "0.1,0.5,0.9,0.97"
eval_seed: 1234

# ── 遥测 ────────────────────────────────────────────────────
telemetry_enabled: true
telemetry_freq_bands: 3
telemetry_slope_window: 6
telemetry_optimizer_every_steps: 0
telemetry_capacity_every_steps: 0

# ── 输出 / 保存 ─────────────────────────────────────────────
output_dir: "./output/krea2-aclora"
output_name: "krea2-aclora"
save_every_epochs: 1
save_every_steps: 0
save_state_every_steps: 100
keep_vae_on_gpu: true
empty_cache_after_sample: false
seed: 42
resume_lora: ""
resume_state: ""
stage_timing_every_steps: 20
stage_timing_warmup: 0

# ── 采样出图 ─────────────────────────────────────────────────
sample_every_epochs: 1
sample_every_steps: 0
sample_infer_steps: 50
sample_cfg_scale: 4.5
sample_sampler_name: "euler"
sample_scheduler: "simple"
sample_width: 0
sample_height: 0
sample_seed: 1234
sample_negative_prompt: ""
sample_prompt: "@g0ut0ng style, 1girl,blue hair,blush,arona (blue archive),classroom"

# ── 日志 / 监控 ─────────────────────────────────────────────
loss_curve_steps: 1
no_progress: false
log_every_steps: 1
no_monitor: false
monitor_host: "0.0.0.0"
monitor_port: 8765
no_browser: true
