# ══════════════════════════════════════════════════════════════════
# Krea 2 训练配置 · 基线 v2（官方经验 × 你的结构/优化器）
#
# 定位：除以下四项外，其余全部对齐官方经验——
#   保留你的：① soap_sf 优化器  ② LoKr+DoRA 结构（纯 LoRA 存储太大）
#             ③ eisbach（锐度） ④ navit 打包（吞吐工程，不改单图数学）
#
# 官方依据（均带出处）：
#   · musubi-tuner krea2 文档：rank/alpha=32、targets=DiT 全 264 Linear（musubi 口径；
#     本仓库默认 263，移除 tproj.1 避免 ComfyUI 推理 OOM）、
#     timestep=krea2_shift（分辨率感知）、RAW 训练。
#     https://github.com/kohya-ss/musubi-tuner/blob/main/docs/krea2.md
#   · JahJedi 实跑配方：AdamW / LR 1e-4 / rank 32 / 800 图 16 epoch。
#     https://huggingface.co/JahJedi/krea2-character-lora-recipe
#   · 本仓库 krea2_res_shift 精确复刻官方 sampling.py 的 mu 内插
#     （@1024²≈2.48，与 musubi "shift 2.5 @1024" 同口径）。
#
# ★ 按官方对齐的项（相对你上一版 train_krea2_baseline.yaml 的差异）：
#   1. lora_targets：显式 8 条 + 排除 txtfusion（224 Linear）→ 不写，
#      走 family 默认全 264 Linear（含 first/last.linear/tmlp/tproj/
#      txtmlp/txtfusion —— 官方推荐口径，上一版实际只有 224）
#   2. timestep_t_min 0.05 → 0（官方无截断；res-shift 后下限本就几乎不触发）
#   3. loss l2 / 无加权 / 正则 dropout 全 0 / grad_clip 1.0（官方 flow-matching 默认）
#
# ★ 有意保留、不按官方的项（及理由）：
#   · LR 4e-4：官方 1e-4 是 AdamW 口径，不可直接移植到 soap_sf；
#     4e-4 是你 memory 实测的 soap_sf 甜点（数据集 t-loss 形状记录）。
#   · weight_decay 1e-4：官方口径是 torch AdamW 默认 0.01，但你 Klein 50 跑
#     实测风格 1e-5 最优、0.001 已过火——soap_sf 下沿用你的实测 1e-4。
#   · lokr_factor 2：LoKr 里最接近官方 full-LoRA 容量的档位，存储 ≈ 纯 LoRA 一半。
#   · dora_fast_norm true：本仓库新增的 DoRA 范数加速（bf16 tensor core 收缩，
#     fp32 累加；范数相对误差 ~1e-3，仅作幅度归一）。若要逐 bit 保守可设 false。
#     dora_detach_norm 保持 false（会改梯度，先不引入变量）。
#
# 步数预期（JahJedi 口径换算）：navit budget 16384 ≈ 4 图/步 →
# 一轮完整参考训练约 3000-3500 步；首个画风信号预计 800-1500 步。
# ══════════════════════════════════════════════════════════════════

# ── 模型路径 ────────────────────────────────────────────────
model_family: "krea2"
transformer_path: "AnimaLoratoolkit/models/transformers/raw.safetensors"
vae_path: "AnimaLoratoolkit/models/vae/qwen_image_vae.safetensors"
krea2_text_encoder_path: "AnimaLoratoolkit/models/text_encoders/Qwen3-VL-4B-Instruct"
krea2_text_max_length: 512
krea2_text_cache_entries: 128

# ── 数据集 ──────────────────────────────────────────────────
data_dir: "./Dataset/your-dataset"          # ★必改
resolution: 1024
repeats: 1

# ── ARB 分桶 ────────────────────────────────────────────────
bucket_base_resos: [1536]
bucket_min_base_reso: 0
bucket_max_base_reso: 0
bucket_base_reso_steps: 256
min_bucket_reso: 512
max_bucket_reso: 3072
bucket_reso_steps: 64
bucket_max_aspect_ratio: 2.7
bucket_no_upscale: true
bucket_max_upscale: 0.0
bucket_report: true
max_img_h: 0
max_img_w: 0

# ── NaViT 块对角打包（保留 ④）───────────────────────────────
navit_packing: true
navit_native_resolution: true
navit_token_budget: 16384
fit_max_tokens: 32768000
fit_warn_tokens: 32768000
navit_max_images_per_pack: 0
navit_multiscale: true
navit_multiscale_token_ladder: "2304,4096"
navit_pack_strategy: ffd
navit_text_trim_padding: false
cache_latents: true
cache_encode_tiled: true
cache_encode_max_pixels: 16777216
fit_packed_training: false
token_bucket: false
bucket_drop_last: false
torch_compile: false

# ── 数据增强 / 打标（沿用你的既有管线）──────────────────────
shuffle_caption: true
keep_tokens: 1
flip_augment: true
tag_dropout: 0.1
tag_dropout_overrides:
  close-up: 0.5
caption_dropout_rate: 0.01
freq_balanced_dropout_strength: 0.0
prefer_json: false

# ── LoKr / DoRA 结构（保留 ②；targets 按官方全 264 Linear）──
# 不写 lora_targets / lora_exclude_patterns → family 默认
# KREA2_DEFAULT_LORA_TARGETS（28 block 全部投影 + txtfusion + txtmlp +
# tmlp + tproj + first + last.linear = 264 个 Linear，musubi 文档口径）。
lora_type: "lokr"
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0
lokr_factor: 2
lora_variant: "dora"
dora_export_mode: "native"
dora_fast_norm: true           # DoRA 范数 bf16 加速（见文件头说明；保守可关）
dora_detach_norm: false        # 会改梯度，基线不引入

rank_dropout: 0.0              # 官方无（欠拟合期也不该加）
module_dropout: 0.0
loraplus_lr_ratio: 1.0

# ── 优化器（保留 ① soap_sf；LR/wd 用你的实测甜点，见文件头）──
optimizer_type: "soap_sf"
learning_rate: 4e-4
lr_scheduler: "none"
optimizer_args:
  betas: [0.9, 0.95]
  shampoo_beta: -1.0
  eps: 1.0e-8
  weight_decay: 0.0001
  precondition_frequency: 5
  max_precond_dim: 10000
  precond_in_state: false      # 保持（resume 显存 fix 依赖它）
  merge_dims: false
  precondition_1d: false
  normalize_grads: false
  data_format: "channels_first"
  correct_bias: true
  weight_lr_power: 2.0
  r: 0.0
  warmup_steps: 0

# ── 训练循环 ────────────────────────────────────────────────
epochs: 200
max_steps: 0
batch_size: 4
effective_batch_size: 0
grad_accum: 1
grad_clip_max_norm: 1.0        # musubi max_grad_norm 默认
grad_norm_log_every: 20
mixed_precision: "bf16"
grad_checkpoint: true
num_workers: 4

# ── Timestep 采样（官方 krea2_shift = logit_normal + res_shift）──
flow_shift: 1.0
timestep_sampling: logit_normal
timestep_stratified: true      # 分位分层降方差（不改分布）
timestep_t_min: 0.0            # 官方无截断
timestep_t_max: 1.0
schedule_shift: 1

# ── krea2 分辨率感知 shift（官方调度，默认端点，勿改）────────
krea2_res_shift: true
krea2_shift_min_res: 256
krea2_shift_max_res: 1280
krea2_shift_y1: 0.5
krea2_shift_y2: 1.15

adaptive_timestep: false

# ── 主 loss（官方 flow-matching = MSE）──────────────────────
loss_type: "l2"
loss_weighting_scheme: "none"
weight_cap_ratio: 0
min_snr_gamma: 0

# ── 噪声 ────────────────────────────────────────────────────
noise_offset: 0
noise_offset_min: 0
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3

# ── 逐图正则 / 辅助 loss（只留 eisbach，保留 ③）─────────────
eisbach_lambda: 0.15

dfm_lambda: 0.0
dfm_mode: "vecor"
aux_spectral_enabled: false
aux_spectral_lambda: 0.065
aux_spectral_use_wavelet: true
aux_spectral_wavelet_lambda: 0.20
aux_spectral_t_gate: 0.55
lwd_mask_enabled: false
lwd_mask_floor: 0.3
aux_perceptual_enabled: false

# ── eval ────────────────────────────────────────────────────
# ★ 官方 res-shift 下 t<0.15 波段几乎不被采样（@1024² P(t'<0.1)≈0.1%），
#   eval@t=0.1 不动是调度的必然，不是欠拟合证据。判断拟合盯 t=0.5/0.9 与采样图。
eval_every: 40
eval_count: 16
eval_t_grid: "0.1,0.5,0.9,0.97"
eval_seed: 1234

# ── 遥测 ────────────────────────────────────────────────────
telemetry_enabled: true
telemetry_freq_bands: 3
telemetry_slope_window: 6
telemetry_optimizer_every: 0
telemetry_capacity_every: 0

# ── 输出 / 保存 ─────────────────────────────────────────────
output_dir: "./output/krea2-v2"            # ★必改
output_name: "krea2-v2"                    # ★必改
save_every: 1
save_every_steps: 0
save_state_every: 100
keep_vae_on_gpu: true
empty_cache_after_sample: false
seed: 42
resume_lora: ""
resume_state: ""
stage_timing_every: 20
stage_timing_warmup: 0

# ── 采样出图 ─────────────────────────────────────────────────
sample_every: 1
sample_steps: 0
sample_infer_steps: 30
sample_cfg_scale: 4.5          # 官方 RAW cfg=3.5 → 本仓库 1+3.5=4.5
sample_sampler_name: "er_sde"
sample_scheduler: "beta"
sample_width: 0
sample_height: 0
sample_seed: 1234
sample_negative_prompt: ""
sample_prompt: "fdy, 1girl"   # ★必改 trigger

# ── 日志 / 监控 ─────────────────────────────────────────────
loss_curve_steps: 1
no_progress: false
log_every: 1
no_monitor: false
monitor_host: "0.0.0.0"
monitor_port: 8765
no_browser: true
