# ══════════════════════════════════════════════════════════════════
# Krea 2 · SNR 门控【上限探针】（2026-07-19）
#
# ★ 定位：这【不是】单变量 A/B，是有意为之的双变量"最大努力版"探针。
#   变量 1：betas[0]  0.9 → 0.98
#   变量 2：snr_power 1.0 → 1.5
#   （optimizer_type 改成 adamw_snr 不算变量：它在 cautious=false +
#     snr_power=1.0 时与 adamw 数学恒等，单测逐元素对拍断言。）
#
#   代价：若有效，无法区分是 β1 还是锐化的功劳，需再跑一次做归因。
#   收益：若连这个最大努力版都没有画面改善，**一次 run 关掉整条优化器路线**。
#   在"实测显示优化器侧上限只有 6.8%"的前提下，这个取舍是合理的。
#
# ── 为什么是这两个、为什么不带 cautious ────────────────────────────
#   cautious 与 snr_power 是同一机理（都是逐坐标 SNR 门控），
#   p=1.5 的预测效果（信号能量 82.7%）已超过 cautious（79.1%），
#   三者同开会让总步长不可控 → 只取更强的那个。
#
# ── 强度校核（已本地用真实梯度分布验过，防止重演 automagic 的无效对照）──
#   锐化的重归一化保持 L1，能量集中后 L2【上升】：
#     p=1.0 → L2 1.000（承载 90% 能量的坐标占 36.7%）
#     p=1.5 → L2 1.270（21.1%）
#     p=2.0 → L2 1.642（11.9%）
#   选 p=1.5 而非 2.0：+27% 落在判读⓪的 0.5~2 倍安全带内，
#   +64% 叠加 β1 改动后偏离过大。lr 保持 5e-5 不做补偿。
#
# ── 判读（沿用已标定的谱形取证工具）────────────────────────────────
#   ⓪ 强度关：tools/lora_delta_forensics.py 与 c12port adamw **同 epoch** 比
#      总 ||dW||^2，须落在基线 0.5~2 倍才算有效对照。
#      cautious 的重归一化设计上保持期望步长，所以这里【应当】自动通过；
#      若不通过说明重归一化没起作用，回来报告。
#   ① 谱形：top1 能量 / 谱条件数应与 adamw 基线同侧（>40% / >10）。
#      逐元素门控理论上不动谱形，单测 TestSpectralShapePreserved 已断言。
#   ② 画面（真正的判据）：与 c12port adamw 同 epoch 对比发丝应力图。
#      假设成立的表现 = 同等画风还原度下线条噪声更少 / 崩坏 epoch 阈值后移。
#
# ── 归因分支（跑完照此走，别再多烧 run）──────────────────────────────
#   · 画面无改善 → 整条优化器路线关闭，回 c12port adamw，精力转数据/打标。
#     （这是本探针的主要价值：一次 run 得到否定性结论。）
#   · 画面有改善 → 再跑一次单变量归因，优先单开 betas[0]=0.98
#     （零实现成本、机理更朴素）；若它单独就能复现，锐化可弃。
#
# ── 诚实的预期管理 ────────────────────────────────────────────────
#   实测显示 AdamW 已把 93% 的更新预算给了非噪声方向，本实验争夺的是剩下
#   6.8%。且噪声方向是随机游走(累积∝√t)、信号是线性累积(∝t)，在最终 ΔW 里
#   噪声占比比 6.8% 更低——这与实测 ΔW 极度 rank-1 主导(top1 98%)自洽。
#   **画面无明显差异是完全可能的正常结果**，届时结论是"优化器层面的噪声抑制
#   在本任务上没有可利用空间"，而不是实现有问题。
#
# ── 备选实验（本文件不带，各自单变量另跑）──────────────────────────
#   A. betas 改 [0.98, 0.999]：零实现成本。依据 = EMA 残余噪声 ∝
#      sqrt((1-b1)/(1+b1))，b1=0.9 只平均 ~10 步，而中位坐标 r=0.094
#      需要 ~100 步才能把方向从噪声里解出来。预测：信噪预算比 9.7 → 17.7。
#   B. snr_power: 1.5（SNR 锐化，本仓库设计）。预测：信号能量 66%→82.7%，
#      噪声 6.84%→1.82%。比 cautious 更激进，建议在 cautious 有结果后再试。
#      p>=3 会饿死大部分坐标（构造期 fail-fast 拦 p>4）。
# ══════════════════════════════════════════════════════════════════
#
# ── 以下为继承自 c12port 的原始说明（各旋钮依据，均未改动）──────────
# Krea 2 训练配置 · C12 经验移植版（2026-07-16）
#
# 定位：把 Anima C12 配方（train_my 43）里"抗记忆/护细节"的经验移植到
# Krea2，针对两个已观测病灶：
#   病灶 A：AI 生成训练集的线条噪声被忠实记忆 → 发丝/线条混乱随 epoch 加重
#           （goutong 集实证：epoch12 干净 / epoch20 崩；换量化/底模不消失）
#   病灶 B：干净训练集出现元素级记忆（个别小物件吸进触发词）
#
# 锚点 = 已在 Krea2 上验证成功的基线（fp8_ab / goutong minimal_diag）：
#   adamw 1e-4 + 标准 LoRA + family 默认 targets + krea2_res_shift 官方口径。
# 每个偏离锚点的旋钮都标注证据等级：
#   [K] = Krea2 已验证   [A] = Anima 验证、Krea2 未验证   [D] = 本次推导、未实证
#
# ── 相对 goutong diag 基线的全部差异（逐条依据）─────────────────────
#  1. timestep_sampling: logit_normal → mixed_uniform_logit(p=0.7) [D]
#     30% uniform 分量补低 t 监督。res-shift@1024²(α≈2.48) 复合后
#     P(t'<0.15) 从 ~0.4% → ~2.3%（≈6×）。依据：发丝在低噪步决定，
#     纯官方调度下该波段无监督，delta 在那里是随 epoch 放大的外推。
#     注意 mix_low_prob 在此模式语义 = "走 logit_normal 的概率"（代码
#     objective.py mixed_uniform_logit 分支），不是低噪比例，勿按名字理解。
#  2. loss: l2 → huber(c=0.2, snr 调度) [A]
#     C12 同款。大残差影响被钝化 → 少追训练集的线条噪声离群残差。
#  3. rank_dropout 0.05 + module_dropout 0.03 [A]
#     C12 同款容量噪声正则，抗逐样本记忆。
#  4. 逐模块 rank 布局 lora_reg_dims [D，物证支撑]
#     Krea2 成功 LoRA 逐层取证：77% 能量在 mlp.gate/up，attn 仅 12.7%
#     （memory krea2-lora-delta-geometry）。把预算从 attn 挪给 mlp：
#     mlp.gate/up=48，attn=16，其余=32。总参数量 ≈ 全 32 基线持平。
#     注意：范数占比≠因果重要性，attn 仍留 16 非归零；以画面 A/B 为准。
#  5. weight_decay 0.01 → 1e-5 [K]
#     你在 Krea2 Klein 50 图 run 实测：风格最优 1e-5，0.001 已过火
#     （fp8_ab 头注释原话）。0.01 只是"贴官方"，非实测最优。
#  6. tag_dropout 0.2(C12) → 0.1（保持 Krea2 基线值）[D]
#     病灶 B 方向性推理：tag 被 drop 时元素归因给触发词/无条件 → 更漏。
#     元素记忆的第一治理在打标（独特元素显式打 tag），不在这里加。
#  7. navit_pack_ffd_window: 256(默认) → 32 [D，代码事实支撑]
#     数据集条目数 < 默认窗口 → 全局 FFD → 每 epoch 包序完全相同
#     （已诊断的 loss epoch 周期形态根因）。32 < 条目数恢复逐 epoch 变包。
#  8. bucket 基准 1536 → 1024 [K]
#     RAW 只训到 1k（官方）；1536 分布外且 res-shift 线性外推 α≈4.3，
#     低 t 被进一步压死（minimal_diag 头注释结论）。multiscale 阶梯保留。
#  9. base_quant: fp8 [K]  —— fp8_ab A/B 已验证拟合等价，省显存提速。
# 10. learning_rate 1e-4 → 5e-5 [用户决策，2026-07-17]
#     动机：goutong 集 epoch12 干净/epoch20 崩，选点窗口过窄；降 LR 拉长
#     "画风已学到 → 伪影记忆崩坏"之间的窗口、提高选点分辨率。
#     注意：官方/社区在 Krea2 上没有 sub-1e-4 的公开实测（1e-4 是唯一
#     公认锚点，官方自家画风 LoRA 结构=r32 全 264，超参未公开）。
#     fallback：若 ~3000 步画风信号仍明显弱于基线同期 → 回 1e-4。
#
# ── C12 里【没有】移植的组件（防误解，都是有意关掉）─────────────────
#   · LoKr f4 + DoRA：LoKr 在 Krea2 结构性不可用（实验矩阵已结案）；
#     DoRA 在 Krea2 无干净格子，不携带进配方。→ 标准 LoRA。
#   · soap_sf：Krea2 上 OOM（已挂起）。muon_sf 可用但校准仅标准 LoRA
#     lr 2e-3 口径 → 首版仍用 adamw（最稳锚点）。
#   · adaptive_timestep(slope)：slope 指标实测系统性饿低 t
#     （memory dataset-tloss-shape），与本配方目标相反 → 关。
#   · aux_spectral / dfm / immiscible：Anima 验证、Krea2 未验证；
#     且 aux_spectral 会把高频推向训练集的高频——对含线条噪声的
#     AI 生成集（病灶 A）方向相反。干净画师集可单变量再开。
#   · 三峰 mixed_logsnr_three：低噪峰(基 t≈0.25)经 res-shift 复合后
#     落到 t'≈0.45（中噪），够不到细节区 → 改用 uniform 掺混。
#
# ── 判读方法（跑之前记住）────────────────────────────────────────
#   A. step 0 采样必须正常（LoRA init 净增量=0）。坏 → 停，回来报告。
#   B. eval_t_grid 的 t=0.1 曲线【应当开始下降】——这是低 t 补监督
#      生效的直接信号（官方调度下它纹丝不动是常态，现在不该了）。
#   C. loss 曲线的 epoch 周期形态应消失（ffd_window 生效的信号）。
#   D. 核心验收（vs goutong diag 基线，同拟合度对比而非同步数）：
#      Turbo 工作流下发丝崩坏的 epoch 阈值是否后移、同等干净度下
#      画风保留是否更多。部署侧"最后 2 步裸底模"技巧可叠加使用。
#   E. 若 1500 步内画风信号明显弱于基线同期 → 先单变量回退 timestep
#      （mixed_uniform_logit → logit_normal），它是本配方最大的分布改动。
# fallback：任何 NaN/尖峰 → 先关 base_quant 回 bf16 再判断；
#   rank/module_dropout 疑似拖慢收敛 → 归零回退（其余不动）。
# ══════════════════════════════════════════════════════════════════

# ── 模型路径 ────────────────────────────────────────────────
model_family: "krea2"
transformer_path: "AnimaLoratoolkit/models/transformers/raw.safetensors"
vae_path: "AnimaLoratoolkit/models/vae/qwen_image_vae.safetensors"
krea2_text_encoder_path: "AnimaLoratoolkit/models/text_encoders/Qwen3-VL-4B-Instruct"
krea2_text_max_length: 512
krea2_text_cache_entries: 128

# ── 数据集 ──────────────────────────────────────────────────
data_dir: "./Dataset/your-dataset"       # ★必改
resolution: 1024
repeats: 1

# ── ARB 分桶（1024 基准 = RAW 分布内，差异 #8）───────────────
bucket_base_resos: [1024]
bucket_min_base_reso: 0
bucket_max_base_reso: 0
bucket_base_reso_steps: 256
min_bucket_reso: 512
max_bucket_reso: 2048
bucket_reso_steps: 64
bucket_max_aspect_ratio: 2.7
bucket_no_upscale: true
bucket_max_upscale: 0.0
bucket_report: true
max_img_h: 0
max_img_w: 0

# ── NaViT 块对角打包（差异 #7：ffd_window 修静态包序）────────
navit_packing: true
navit_native_resolution: true
navit_token_budget: 16384
fit_max_tokens: 32768000
fit_warn_tokens: 32768000
navit_max_images_per_pack: 0
navit_multiscale: true
navit_multiscale_token_ladder: "2304,4096"
navit_pack_strategy: ffd
navit_pack_ffd_window: 32       # ★差异 #7：默认 256 > 数据集条目数 = 全局 FFD 静态包序
navit_text_trim_padding: false
cache_latents: true
cache_encode_tiled: true
cache_encode_max_pixels: 16777216
fit_packed_training: false
token_bucket: false
bucket_drop_last: false
torch_compile: false

# ── 底模量化（差异 #9，[K] fp8_ab 已验证）────────────────────
base_quant: fp8
base_quant_gemm: auto
base_quant_fp8_scale: auto
base_quant_fp8_grad: false

# ── 数据增强 / 打标（差异 #6：tag_dropout 保持 0.1）──────────
shuffle_caption: true
keep_tokens: 1
flip_augment: true
tag_dropout: 0.1
tag_dropout_overrides:
  close-up: 0.5
caption_dropout_rate: 0.01
freq_balanced_dropout_strength: 0.0
prefer_json: false

# ── LoRA 结构：标准 LoRA + 逐模块容量布局（差异 #3/#4）───────
# 不写 lora_targets → family 默认全部 Linear（与成功基线一致）
lora_type: "lora"
lora_rank: 32                   # 未被 reg_dims 命中的模块用它
lora_alpha: 32.0
lora_dropout: 0.0
lora_variant: "base"            # 无 DoRA（Krea2 无干净验证格子）

# 差异 #4：预算从 attn 挪向 mlp gate/up（实测能量 77% vs 12.7%）
# alpha=rank 逐档同步（保持 scaling=1，与基线口径一致）
lora_reg_dims:
  '.*mlp\.(gate|up)$': 48
  '.*attn\.(wq|wk|wv|wo|gate)$': 16
lora_reg_alphas:
  '.*mlp\.(gate|up)$': 48
  '.*attn\.(wq|wk|wv|wo|gate)$': 16

rank_dropout: 0.05              # ★差异 #3 [A] C12 同款
module_dropout: 0.03            # ★差异 #3 [A] C12 同款
loraplus_lr_ratio: 1.0

# ── 优化器（★本实验唯一变量：cautious 掩码 开）─────────────────
# adamw_snr 在 cautious=false + snr_power=1.0 时与 adamw **数学恒等**
# （单测 TestDefaultsEquivalentToAdamW 逐元素对拍），所以这里唯一变量
# 就是 cautious 一个布尔量，lr/betas/wd 全部与 c12port 逐字段一致。
#
# 依据（本地实测，非论文转述）：对 c12port adamw 成功 run 的 step800
# 优化器状态做逐坐标 SNR 测量（113.7M 坐标，r=mu/sigma）：
#   r 分位：25%=0(纯噪声) 50%=0.094 90%=0.66 95%=0.93
#   噪声坐标(r<0.15) 占 54% 坐标数，但仅占 6.84% 更新能量
#   信号坐标(r>0.5)  占 17% 坐标数，占 66.0% 更新能量
# cautious 掩码（arXiv:2411.16085, ICLR 2025）的预测效果：
#   信号能量 66.0% → 79.1%，噪声能量 6.84% → 2.96%（信噪预算比 9.7 → 26.7）
#
# ⚠ 预期收益上限有限：AdamW 自己已经把 93% 的预算给了非噪声方向，
#   本实验争夺的只是剩下那 6.8%。若画面无明显差异属正常结果，不是实现问题。
optimizer_type: "adamw_snr"
learning_rate: 5e-5             # 与 c12port 完全一致（不补偿锐化带来的 +27% 步长，
                                # 因其仍在判读⓪的 0.5~2 倍安全带内，宁可强度足够）
lr_scheduler: "none"
optimizer_args:
  betas: [0.98, 0.999]          # ★变量 1（c12port 是 0.9）
  eps: 1.0e-8
  weight_decay: 0.00001         # ★差异 #5 [K] Klein 50 实测风格甜点
  cautious: false               # ★不开：与锐化同机理（都是 SNR 门控），
                                #   p=1.5 预测效果(82.7%)已超 cautious(79.1%)，
                                #   三者同开会让总强度不可控
  snr_power: 1.5                # ★变量 2（1.0 = 标准 AdamW）

# ── 训练循环 ────────────────────────────────────────────────
epochs: 200
max_steps: 0
batch_size: 4
effective_batch_size: 0
grad_accum: 1
grad_clip_max_norm: 1.0
grad_norm_log_every: 20
mixed_precision: "bf16"
grad_checkpoint: true
num_workers: 4

# ── Timestep 采样（差异 #1：uniform 掺混补低 t）───────────────
# mixed_uniform_logit：mix_low_prob = 走 logit_normal 的概率（≠低噪比例！）
# 0.7 → 70% 官方形状 + 30% uniform；uniform 分量同样过 res-shift，
# 复合后 P(t'<0.15) ≈ 2.3%（基线 ~0.4%）。
flow_shift: 1.0
timestep_sampling: mixed_uniform_logit
timestep_mix_low_prob: 0.7
timestep_stratified: true
timestep_t_min: 0.0
timestep_t_max: 1.0
schedule_shift: 1

# ── krea2 分辨率感知 shift（官方调度不动，与 #1 复合）─────────
krea2_res_shift: true
krea2_shift_min_res: 256
krea2_shift_max_res: 1280
krea2_shift_y1: 0.5
krea2_shift_y2: 1.15

adaptive_timestep: false        # slope 指标饿低 t，与本配方目标相反，明确关

# ── 主 loss（差异 #2：huber + snr 调度，C12 同款）─────────────
loss_type: "huber"
huber_c: 0.2
huber_schedule: "snr"
huber_snr_clamp_max: 2.0
loss_weighting_scheme: "none"
weight_cap_ratio: 0
min_snr_gamma: 0

# ── 噪声 ────────────────────────────────────────────────────
noise_offset: 0
noise_offset_min: 0
noise_offset_random_strength: false
pyramid_noise_iterations: 0
pyramid_noise_discount: 0.3

# ── 辅助 loss（eisbach 保留 [K]；其余首版全关，见头注释）──────
eisbach_lambda: 0.15

dfm_lambda: 0.0
dfm_mode: "vecor"
aux_spectral_enabled: false     # 对含线条噪声的 AI 生成集方向相反，勿开
aux_spectral_lambda: 0.065
aux_spectral_use_wavelet: true
aux_spectral_wavelet_lambda: 0.20
aux_spectral_t_gate: 0.55
lwd_mask_enabled: false
lwd_mask_floor: 0.3
aux_perceptual_enabled: false
immiscible_enabled: false       # Krea2+navit 未验证，首版收窄变量面

# ── eval ────────────────────────────────────────────────────
# ★ 判读 B：本配方下 t=0.1 曲线应开始下降（低 t 有监督了）。
eval_every: 40
eval_count: 16
eval_t_grid: "0.1,0.5,0.9,0.97"
eval_seed: 1234

# ── 遥测 ────────────────────────────────────────────────────
telemetry_enabled: true
telemetry_freq_bands: 3
telemetry_slope_window: 6
telemetry_optimizer_every: 0
telemetry_capacity_every: 0

# ── 输出 / 保存 ─────────────────────────────────────────────
output_dir: "./output/krea2-snrgate"   # ★必改
output_name: "krea2-snrgate"           # ★必改（★上次 automagic 忘改名，务必改）
save_every: 1
save_every_steps: 0
save_state_every: 100
keep_vae_on_gpu: true
empty_cache_after_sample: false
seed: 42
resume_lora: ""
resume_state: ""
stage_timing_every: 20
stage_timing_warmup: 0

# ── 采样出图（进度条用；checkpoint 选点在 Turbo 工作流做）─────
# 提示词电池（2026-07-17，仿官方 darkbrush 预览法：分布外场景 × 病灶探针）。
# 轮换语义（anima_train.py get_next_sample_prompt）：每次采样事件轮换 1 条，
# sample_every=1 → 同一条提示词每 4 个 epoch 重现一次（固定 seed 可比）。
# step-0 基线会把前 N 条都各采一张作对照。嫌密度不够可删到 2 条（保 #1/#2）。
# 判读：
#  #1 发丝应力：线条崩坏在这条上最先显形 → 定位崩坏 epoch 阈值
#  #2 元素记忆探针：白背景+简单裙，画面里凭空多出的道具/背景=病灶 B 信号
#  #3 分布外迁移：训练集不会有的场景，画风应带过去；只出"训练集式构图"=记忆
#  #4 服从性：多主体绑定，LoRA 不应损伤底模的 prompt 追从（官方关注点）
sample_every: 1
sample_steps: 0
sample_infer_steps: 30
sample_cfg_scale: 4.5
sample_sampler_name: "er_sde"
sample_scheduler: "beta"
sample_width: 0
sample_height: 0
sample_seed: 1234
sample_negative_prompt: ""
sample_prompt: "@g0ut0ng style, 1girl"         # ★必改 trigger（sample_prompts 为空时的后备）
sample_prompts:                                 # ★必改 trigger 前缀，与训练 caption 同款
  - "@g0ut0ng style, 1girl, close-up portrait, long flowing hair, wind, detailed hair strands, looking at viewer, dark simple background"
  - "@g0ut0ng style, 1girl, standing, full body, plain white background, simple white dress, arms at sides"
  - "@g0ut0ng style, 1girl, riding a bicycle through a rainy neon-lit street at night, holding a transparent umbrella, reflection in puddle"
  - "@g0ut0ng style, 2girls, one sitting on a park bench eating ice cream, the other standing behind her pointing at the sky, autumn leaves falling"

# ── 日志 / 监控 ─────────────────────────────────────────────
loss_curve_steps: 1
no_progress: false
log_every: 1
no_monitor: false
monitor_port: 8765
monitor_host: "0.0.0.0"
no_browser: true
