# ══════════════════════════════════════════════════════════════════
# Krea 2 (K2) LoRA · Kaggle TPU v5e-8 模板（jax_tpu 后端，FSDP 权重分片）
#
# 与 GPU 侧 train_krea2_baseline.yaml 的关系：同一套 model_family 语义，
# 但 TPU 后端是**子集**（jax_tpu/config.py 对未移植键 fail-fast，不静默忽略）。
# 与 Anima TPU 路线的差别（架构层面，详见 jax_tpu/krea2_jax.py 头注）：
#   * 单流 MMDiT：text+image 同一条序列，每图段 = [text ; image]，预算两边一起花
#   * 12.16B bf16 ≈ 24GB > 单 chip 15.7GiB -> FSDP：权重按 8 卡分片（每卡 ~3GB），
#     每层 remat 内 all_gather（真机 spmd_probe P1：9.8k tok/s @ 16384/卡）
#   * 文本特征是 Qwen3-VL **12 层**堆叠 [L,12,2560]（tools/cache_text_features.py
#     --model-family krea2 产出，键 txt），navit 只打包有效 token
# ══════════════════════════════════════════════════════════════════

model_family: "krea2"
# ★ Krea-2-**Raw**（训练一律用 RAW）。26.3GB —— 真机上建议预先传成 Kaggle
#   Dataset 后用 --env ANIMA_TRANSFORMER 指过去（见 docs/GUIDE_new_training.md ④）。
transformer_path: "/path/to/krea2/raw.safetensors"
# 下面两个只在**数据缓存阶段**用到，TPU 侧从不读它们。
vae_path: "/path/to/qwen_image_vae.safetensors"
krea2_text_encoder_path: "/path/to/Qwen3-VL-4B-Instruct"   # 缓存阶段用（HF 目录）
krea2_text_max_length: 512      # 缓存口径（官方 encoder.py 值）；TPU 侧为 cache-side no-op

# ── 数据集（本地值；Kaggle 上由 ANIMA_DATA_DIR 覆盖）─────────────
# ★必改。需先跑 tools/cache_latents.py，文本侧二选一：
#   ① tools/dump_caption_ids.py + build_job --caption-ids（推荐，上传只 40KB）
#   ② tools/cache_text_features.py --model-family krea2（本地算，1.7GB/96 张）
data_dir: "/path/to/your-dataset-cache"
resolution: 1024
repeats: 1

# ── ARB 分桶（TPU 侧为 cache-side no-op，语义已烘焙进 npz）────────
bucket_base_resos: [1536]
bucket_min_base_reso: 0
bucket_max_base_reso: 0
bucket_base_reso_steps: 256
min_bucket_reso: 512
max_bucket_reso: 3072
bucket_reso_steps: 64
bucket_max_aspect_ratio: 2.7
bucket_no_upscale: true
bucket_max_upscale: 0.0
bucket_report: true
max_img_h: 0
max_img_w: 0

# ── NaViT 打包（单流：预算 = text+image 合计）────────────────────
navit_packing: true
navit_native_resolution: true
# TPU 全局预算 = 8 卡 × 10240。K2 的段含 text 槽（量化到 128），10240/卡里
# 约有 1-3k 花在 text 上 —— 单图最大 image token 必须 <= 预算减去自己的 text 槽，
# 否则打包器 fail-fast（"单段 N > budget"）。RAW 训练分布只到 ~1k，
# 超过 ~4096 token（1024²）属于底模分布外，谨慎（口径见 docs/ARCH_FINDINGS.md
# 的 Krea2 节）。
#
# **81920 是 K2 真机已验工作点，别往上调**（单卡上限 15.7GiB）：
#   131072 (8×16384) -> 运行期 HLO temporaries 18.15G，OOM
#    98304 (8×12288) -> executable reserve 11.94G vs free 11.74G，OOM
#    81920 (8×10240) -> 跑通（20 epoch/254 步 与 18 epoch/176 步 两次长训）
# 开训前用 jax_tpu/tests/enum_quantum_advisor.py 对着自己的数据集再算一遍。
navit_token_budget: 81920
fit_max_tokens: 32768000
fit_warn_tokens: 32768000
# navit_max_images_per_pack：TPU 侧未移植（packing.ffd 只按 token budget 装箱），
# 写非 0 会 fail-fast。要限图数请调小 navit_token_budget。
navit_multiscale: true
navit_multiscale_token_ladder: "2304,4096"   # 贴合 RAW 分布（768²~1024²）
navit_pack_strategy: ffd
# navit_text_trim_padding 对 krea2 无意义（navit 本来就只打包有效 token），别写
cache_latents: true
cache_encode_tiled: true
cache_encode_max_pixels: 16777216

# ── 数据增强 / 打标 ─────────────────────────────────────────────
shuffle_caption: false         # TPU 未移植（编码前操作，要它在缓存阶段做）
keep_tokens: 1
flip_augment: true             # 缓存需含 latent_flipped
tag_dropout: 0.0               # TPU 未移植（同上，编码前操作）
caption_dropout_rate: 0.01     # 需要 _empty.textfeat.npz（krea2 格式）
freq_balanced_dropout_strength: 0.0
prefer_json: false

# ── LoRA 结构 ───────────────────────────────────────────────────
# 缺省 targets = 官方/musubi 推荐的 DiT 全部 264 个 Linear（含 tproj.1）。
# 想复刻官方"长训练"的 attention-only（保 prompt 追随性）：
#   lora_targets: ["attn.wq","attn.wk","attn.wv","attn.wo","attn.gate"]
#   lora_exclude_patterns: [".*txtfusion.*"]
lora_type: "lora"              # 官方口径；lokr 也已移植（jax_tpu/adapters.py 同数学）
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0              # TPU 未移植（rank_dropout/module_dropout 已移植）
lokr_factor: 4
lora_variant: "base"           # dora 也已移植（dora_scale 初值取自加载时流式行范数）
dora_export_mode: "native"
rank_dropout: 0.0
module_dropout: 0.0
loraplus_lr_ratio: 1.0

# ── 优化器（TPU 已实现 adamw / adamw_snr；soap_sf 等未移植，见 config.py）─────
optimizer_type: "adamw"        # 官方 AdamW=1e-4
learning_rate: 1e-4
optimizer_args:
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0001
epochs: 200
max_steps: 0
grad_accum: 1
grad_clip_max_norm: 1.0
mixed_precision: "bf16"
grad_checkpoint: true          # = remat full（K2 必须 != none：all_gather 要在 remat 内）

# ── timestep（官方 shift-only + 分辨率感知 res_shift）─────────────
flow_shift: 1.0                # base 不额外偏移，shift 全交给 res_shift
timestep_sampling: logit_normal
timestep_stratified: true
timestep_t_min: 0.05
timestep_t_max: 1.0
schedule_shift: 1.0            # krea2_res_shift 接管；!=1.0 会双重偏移（构造期报错）
timestep_mix_low_prob: 0.5
timestep_mix_high_prob: 0.25
timestep_logsnr_mu: -6.0
timestep_logsnr_sigma: 2.0
timestep_mix_anneal_start: 0
timestep_mix_anneal_end: 0
timestep_mix_low_prob_end: -1.0
timestep_mix_high_prob_end: -1.0
timestep_laplace_mu: 0.0
timestep_laplace_b: 0.5
krea2_res_shift: true          # 官方 mu(seq_len) 分辨率感知 shift（训练侧等价）
krea2_shift_min_res: 256
krea2_shift_max_res: 1280
krea2_shift_y1: 0.5            # exp(0.5)=1.65 @256²  ← 官方 ~1.6
krea2_shift_y2: 1.15           # exp(1.15)=3.16 @1280² ← 官方 ~3.2；@1024²≈2.48 ← 官方 2.5

# ── loss / 噪声 / aux（latent 空间技术，与模型族无关，全部已移植）─────────────
loss_type: "mse"
huber_c: 0.1
huber_schedule: "constant"
huber_snr_clamp_max: 10.0
loss_weighting_scheme: "none"
min_snr_gamma: 5.0
detail_inv_t_min: 1.0
detail_inv_t_max: 5.0
immiscible_enabled: false
immiscible_k: 4
eisbach_lambda: 0.0            # >0 即开（objective.py:814 同数学，图像流上）
dfm_lambda: 0.0                # >0 即开；TPU 只支持 vecor（两支增强都已移植）
dfm_mode: "vecor"
aux_spectral_enabled: false
aux_spectral_lambda: 0.05
aux_spectral_use_wavelet: false
aux_spectral_wavelet_lambda: 0.05
aux_spectral_t_gate: 0.7

# ── 自适应 timestep 重采样（slope 口径与 PyTorch 侧逐行一致）─────────────────
adaptive_timestep: false
adaptive_timestep_metric: "slope"
adaptive_timestep_bins: 16
adaptive_timestep_ema_decay: 0.95
adaptive_timestep_slope_slow_decay: -1.0
adaptive_timestep_burn_in: 160
adaptive_timestep_min_factor: 0.5
adaptive_timestep_max_factor: 2.0
adaptive_timestep_base_mix: 0.25
adaptive_timestep_candidate_mult: 8
adaptive_timestep_low_noise_gate: false
adaptive_timestep_gate_n: 3.0
adaptive_timestep_gate_c: 0.05
adaptive_timestep_highfreq_weight: 0.25

# ── eval / 存档 / 断点接棒 ─────────────────────────────────────
eval_every: 0                  # >0 时必须有 eval_t_grid（否则构造期报错）
eval_count: 0
eval_t_grid: ""
eval_seed: 1234
output_dir: "./output"
output_name: "krea2-tpu"
save_every: 1
save_every_steps: 0
save_state_every: 0            # 长训建议 50-100：存完整优化器状态 + 自适应 EMA
resume_state: ""
log_every: 1
